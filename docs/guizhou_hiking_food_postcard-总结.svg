<div class="container">
  <h1>09. 在贵州｜满眼新奇的爬山玩水，与热泪盈眶的美食</h1>
  <div class="meta">
    <span class="tag tag-gray">播客</span>
    <span class="tag tag-purple">还没想好 POSTCARD</span>
    <span class="tag tag-orange">约1小时6分</span>
    <span class="tag tag-blue">旅行</span>
    <span class="tag tag-green">对谈</span>
  </div>
  <div class="summary-line">大壮 × 朗兹（贵州人）：贵州存在感低，但夏天凉快、夜生活松弛、粉面糯米热泪盈眶。贵阳小而深吃；青岩猪蹄、南江大峡谷漂流、安顺剁剁粉；黎平肇兴侗寨比千户苗寨更少商业感。一句话：没去过贵州的，建议至少去一次——跟着本地人吃，比追网红景点更值。</div>

  <div class="timeline">
    <h3>关键时间轴</h3>
    <div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">开场：主修贵州粉；人太瘦没好事</span></div>
    <div class="timeline-item"><span class="timeline-time">02:09</span><span class="timeline-text">村超/村BA短暂火；贵州长期存在感偏低</span></div>
    <div class="timeline-item"><span class="timeline-time">06:04</span><span class="timeline-text">茅台、老干妈、龚琳娜/周深：单点出名却难联贵州</span></div>
    <div class="timeline-item"><span class="timeline-time">11:17</span><span class="timeline-text">爽爽的贵州：暑期避暑；贵阳凌晨三点还能做美甲</span></div>
    <div class="timeline-item"><span class="timeline-time">23:36</span><span class="timeline-text">街头吃：糯米饭、洋芋粑、小豆腐、各种粉</span></div>
    <div class="timeline-item"><span class="timeline-time">33:58</span><span class="timeline-text">青岩古镇猪蹄；洋朗/养朗辣子鸡</span></div>
    <div class="timeline-item"><span class="timeline-time">41:56</span><span class="timeline-text">南江大峡谷漂流：被推到瀑布下+免费姜茶烤肠</span></div>
    <div class="timeline-item"><span class="timeline-time">55:02</span><span class="timeline-text">安顺剁剁粉；黎平小七孔 vs 肇兴侗寨</span></div>
    <div class="timeline-item"><span class="timeline-time">01:05</span><span class="timeline-text">结语：贵州欢迎你；暑期强烈推荐一去</span></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node node-orange">存在感低</div><span class="arrow">≠</span>
      <div class="node">不好玩</div><span class="arrow">→</span>
      <div class="node">避暑+吃</div><span class="arrow">→</span>
      <div class="node">漂流/侗寨</div><span class="arrow">→</span>
      <div class="node node-green">跟本地人</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解 / 认知纠偏</h3>
    <p>· 「贵州=穷/落后大山」——印象残留；夏天凉快、城市夜生活与美食密度被低估。</p>
    <p>· 「黄果树=贵州全部」——景点单点出名，省域文化符号传播不足；暑假人挤可战略性错过。</p>
    <p>· 「千户苗寨=必去少数民族体验」——更商业；肇兴侗寨相对小而美、歌声夜场更打动人。</p>
    <p>· ASR：「朗兹→朗兹（嘉宾）」「地牢→地道」「村别→村BA」「贾秀楼→甲秀楼」「青年古镇→青岩古镇」「洋朗→养朗/附近乡镇」「南疆大峡谷→南江大峡谷」「多多粉→剁剁粉」「小蛆孔→小七孔」「赵兴动债→肇兴侗寨」「踢田→梯田」「资金洞→织金洞」「梵境山→梵净山」。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">一、为什么值得去</h2>
    <div class="card">
      <h3>存在感低 ≠ 不好玩</h3>
      <p>相邻云南/成都/重庆/湖南有持续文旅心智；贵州常靠村超等事件短暂出圈。黄果树人人知，却未必联想到「贵州」。茅台、老干妈、歌手单点全球闻名，拼起来才发现都是贵州。</p>
      <div class="quote">我建议所有没有去过贵州的朋友都可以去一次。</div>
    </div>
    <div class="card card-green">
      <h3>适合谁：自然、美食、民族文化</h3>
      <p>暑期大学生/年假：安顺高铁站自嘲「二十一度」；贵阳城市不大、可骑车绕；松弛感强。诉求三件套：山水、吃、少数民族村落。</p>
      <div class="action">优先跟本地人/懂吃的朋友；「街上有本地人的店」比网红榜更稳。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">二、吃什么 / 玩什么</h2>
    <div class="card">
      <h3>街头主修课：粉与糯米</h3>
      <p>咸甜辣一体的糯米饭（酱油猪油+土豆丝海带辣椒白糖脆哨）；洋芋粑（土豆泥煎饼）；炭火烤小豆腐；各式粉。注意：折耳根（鱼腥草）可要求「免这耳根」。</p>
      <div class="pitfall">人太瘦没好事——贵州菜劝吃，别以减肥心态扫街。</div>
    </div>
    <div class="card card-orange">
      <h3>贵阳周边：青岩、辣子鸡、漂流</h3>
      <p>青岩古镇：商业内核常见，但城墙军事重镇格局完整，猪蹄香滑必试。养朗一带瓷粑辣椒炒辣子鸡≠川式干炸挑肉。南江大峡谷漂流：后段刺激，本地大哥会把船推到瀑布下淋湿——结束后有热水澡、免费姜茶、烤肠。</p>
      <div class="relation">甲秀楼可打卡合影；「贵阳白宫」花果园神秘欧式大建筑，本地人也好奇。</div>
    </div>
    <div class="card card-purple">
      <h3>安顺与黔东南</h3>
      <p>安顺剁剁粉：签子戳米豆腐；夏天午后要穿外套。黎平小七孔清澈如「贵州版九寨沟气质」；肇兴侗寨群山梯田+侗歌夜场，比千户苗寨更少纯商业感。织金洞：溶洞里的「徒步」，灯光石柱，适合想换新鲜玩法的人。</p>
      <div class="action">时间紧：贵阳吃透+青岩+一次漂流；时间多：肇兴侗寨优先于网红大寨。</div>
    </div>
    <div class="card card-red">
      <h3>安全与避坑</h3>
      <p>非正规司机可能市区提前甩客：宁可换正规网约/出租，别硬刚。暑假黄果树人墙级拥堵可主动放弃。野瀑布有趣，但勿贸然冲水。</p>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">对照表</h2>
    <div class="card">
      <table>
        <thead><tr><th>诉求</th><th>更推荐</th><th>可降级/跳过</th></tr></thead>
        <tbody>
          <tr><td>避暑+城市吃</td><td>贵阳街头粉/糯米/豆腐</td><td>只打卡甲秀楼合影</td></tr>
          <tr><td>古镇半日</td><td>青岩（猪蹄+城墙）</td><td>同质化商铺逛街</td></tr>
          <tr><td>刺激玩水</td><td>南江大峡谷漂流</td><td>人挤的黄果树暑假</td></tr>
          <tr><td>民族文化</td><td>肇兴侗寨</td><td>过度商业的大寨</td></tr>
          <tr><td>奇特自然</td><td>织金洞 / 野瀑（量力）</td><td>走马观花大景点清单</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>贵州被低估：凉快、松弛、吃到哭、山水与侗寨都扎实</li>
      <li>跟着本地人吃街头，比追单一网红瀑布更能理解贵州</li>
      <li>商业大寨可省；漂流与侗寨歌声往往是记忆点</li>
    </ul>
    <h3>行动清单</h3>
    <ol>
      <li>暑期订贵阳/安顺，预留「只吃街头」的空白半天</li>
      <li>糯米饭/洋芋粑点单时说清是否要折耳根</li>
      <li>青岩必试猪蹄；有体力就排一次南江漂流</li>
      <li>民族文化优先肇兴侗寨，傍晚听侗歌</li>
      <li>交通只用正规网约；遇甩客果断换车</li>
    </ol>
    <h3>关键认知转变</h3>
    <p>以前：贵州=黄果树+贫困印象；现在：爽爽的贵州是「吃与玩密度很高、心智却还没被写满」的目的地——去一次，比在网上争论它火不火更有用。</p>
  </div>
  <div class="footer">还没想好 POSTCARD · 大壮 × 朗兹 · 小宇宙 · Whisper 转录整理 · 2026-09-19</div>
</div>
    </div>
  </foreignObject>
</svg>
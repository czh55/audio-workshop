<div class="conclusion">
  <h2>总结与行动</h2>
  <h3>核心要点</h3>
  <ul>
    <li>摄影风格常是现实偶然的结果，不必焦虑「选风格」；你的限制可能是签名</li>
    <li>「脏」与瑕疵是真实存在的，对抗工业标准与AI完美，但不是为反而反</li>
    <li>环行地式社区的价值：放大失败、慢下来看人，产生真实连结而非消费</li>
    <li>半年不拍照没关系，表达形式多样，生活与痛苦本身都重要</li>
    <li>摄影是权力游戏：记住自己握有叙述权，亲密关系中更需明确同意与边界</li>
  </ul>
  <h3>行动清单</h3>
  <ol>
    <li>翻看自己早期「不满意」的作品，挑一张公开发布，观察他人反馈是否与你预期相反</li>
    <li>下次给亲近之人拍照前，口头说明拍摄意图、成片效果与对方可否拒绝</li>
    <li>若陷入创作停滞，允许暂停拍照一周，用日记/对话/音乐等其他方式释放表达</li>
    <li>浏览喜欢的摄影师作品时，追问一张好照片背后被拍者的感受与同意过程</li>
    <li>在小众社区（如环行地）慢下来多看一两眼他人作品，写下一句真实感受而非点赞滑过</li>
  </ol>
  <h3>关键认知转变</h3>
  <p>以前认为摄影要追求风格、清晰与持续产出；现在理解了创作是在标准化时代里对真实的共同反抗——风格来自偶然，暂停是允许的，而马子与相互陪伴本身，或许就是「去罗马」的答案。</p>
</div>


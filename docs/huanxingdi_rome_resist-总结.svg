<div class="section">
  <h2 class="sec-title">六、去罗马：目的地还是已在路上？</h2>

  <div class="card card-purple">
    <h3>💡 心法：马子或许就是罗马</h3>
    <p><b>为什么重要：</b>「条条大路通罗马」常被引用却少人追问罗马是什么；摄影追求的真爱与真，或许不在远方终点，而在相互陪伴的当下。</p>
    <div class="quote">「我可能已经到了罗马了，但是我可能就是看不到，这就是在罗马。」</div>
    <div class="action">怎么落地：从漳州搬到宁波只是「离开」，未必有明确目的地；人生可能一直在路上，到达也可能失望</div>
    <p><b>适用边界：</b>去罗马希望被记住的是照片（电子永生），而非人设魅力——表达凝结在影像中</p>
  </div>

  <div class="card">
    <h3>争议讨论：才华与伦理能否分开？</h3>
    <p><span class="speaker speaker-host">主持人</span>：深濑昌久才华毋庸置疑，但洋子的感受被忽视；欣赏作品时需带怀疑与思辨，不能一股脑说好。</p>
    <p><span class="speaker speaker-guest">嘉宾</span>：认同需要反思权力，承认自己并非完全清白，但意识本身是第一步。</p>
    <div class="highlight">原文依据：「我们一定要抛开表面看本质……需要带一些怀疑，但这种怀疑并不是一定我们就否认了他」</div>
  </div>

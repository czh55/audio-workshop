<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>播客知识墙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b1120;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #60a5fa;
      --accent2: #a78bfa;
      --accent3: #f472b6;
      --tag-blue: rgba(96,165,250,0.15);
      --tag-purple: rgba(167,139,250,0.15);
      --tag-green: rgba(52,211,153,0.15);
      --tag-orange: rgba(251,146,60,0.15);
      --card-hover: rgba(255,255,255,0.08);
    }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.6;
    }

    /* ====== 顶部区域 ====== */
    .hero {
      position: relative;
      padding: 64px 24px 48px;
      text-align: center;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: 50%;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(96,165,250,0.08) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .hero h1 {
      font-size: 44px;
      font-weight: 900;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 40%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      position: relative;
      margin-bottom: 12px;
    }
    .hero p {
      font-size: 17px;
      color: var(--text-secondary);
      max-width: 500px;
      margin: 0 auto;
      position: relative;
    }
    .transcript-link {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 22px;
      border-radius: 24px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 14px;
      text-decoration: none;
      background: rgba(96,165,250,0.08);
      transition: all .2s;
      position: relative;
      z-index: 1;
    }
    .transcript-link:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-1px);
    }

    /* ====== 统计栏 ====== */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 0 24px 32px;
      flex-wrap: wrap;
    }
    .stat-item {
      text-align: center;
    }
    .stat-num {
      font-size: 36px;
      font-weight: 900;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ====== 日历导航 ====== */
    .calendar-wrapper {
      max-width: 360px;
      margin: 0 auto 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(12px);
    }
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .cal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .cal-nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
    }
    .cal-nav-btn:hover {
      background: var(--card-hover);
      color: var(--text);
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }
    .cal-day-header {
      font-size: 12px;
      color: var(--text-muted);
      padding: 4px 0;
      font-weight: 600;
    }
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border-radius: 8px;
      cursor: default;
      color: var(--text-secondary);
      transition: all 0.15s;
      position: relative;
    }
    .cal-day.has-data {
      cursor: pointer;
      color: var(--text);
      font-weight: 700;
      background: rgba(96,165,250,0.12);
    }
    .cal-day.has-data:hover {
      background: rgba(96,165,250,0.25);
      transform: scale(1.1);
    }
    .cal-day.today {
      border: 2px solid var(--accent);
    }
    .cal-day.other-month {
      color: var(--text-muted);
      opacity: 0.3;
    }
    .cal-today-btn {
      display: block;
      margin: 12px auto 0;
      padding: 6px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cal-today-btn:hover {
      background: var(--card-hover);
      color: var(--text);
    }

    /* ====== 主内容区 ====== */
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* ====== 时间线 ====== */
    .timeline {
      position: relative;
      padding-left: 40px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 16px;
      top: 8px;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, rgba(96,165,250,0.4), rgba(167,139,250,0.2), transparent);
    }
    .date-group {
      margin-bottom: 40px;
      position: relative;
    }
    .date-dot {
      position: absolute;
      left: -28px;
      top: 10px;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(96,165,250,0.15);
    }
    .date-label {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .date-label .weekday {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--surface);
    }
    .date-label .count-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(96,165,250,0.12);
      padding: 2px 10px;
      border-radius: 10px;
    }

    /* ====== 卡片 ====== */
    .card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 12px;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      opacity: 0;
      transition: opacity 0.25s;
      border-radius: 0 3px 3px 0;
    }
    .card:hover {
      background: var(--card-hover);
      border-color: rgba(255,255,255,0.15);
      transform: translateX(4px);
    }
    .card:hover::before {
      opacity: 1;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
    }
    .card-time {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      margin-top: 2px;
    }
    .card-summary {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .card-tag {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 6px;
      font-weight: 600;
    }
    .tag-blue   { background: var(--tag-blue);   color: #60a5fa; }
    .tag-purple { background: var(--tag-purple); color: #a78bfa; }
    .tag-green  { background: var(--tag-green);  color: #34d399; }
    .tag-orange { background: var(--tag-orange); color: #fb923c; }
    .card-author {
      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #a5b4fc;
      background: rgba(167,139,250,0.12);
      border: 1px solid rgba(167,139,250,0.2);
      padding: 2px 10px;
      border-radius: 999px;
    }
    .card-link-icon {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: var(--text-muted);
      opacity: 0;
      transition: all 0.2s;
    }
    .card:hover .card-link-icon {
      opacity: 1;
      right: 16px;
    }
    .card-error {
      opacity: 0.5;
      border-left: 3px solid #ef4444;
    }
    .card-error:hover {
      opacity: 0.7;
      transform: none;
    }
    .card-error .card-title {
      color: #f87171;
    }
    .card-source-link {
      display: inline-block;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .card-source-link:hover {
      color: var(--accent);
    }
    .card-links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      margin-top: 4px;
    }
    .card-links .card-source-link {
      margin-top: 0;
    }
    .card-links .card-en-link {
      color: var(--teal, #0d686c);
      font-weight: 600;
      border-bottom: 1px dashed rgba(13, 104, 108, 0.5);
    }
    .card-links .card-en-link:hover {
      color: var(--accent);
      border-bottom-style: solid;
    }
    .card-duration {
      display: inline-block;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(167,139,250,0.1);
    }

    /* ====== 专题区 ====== */
    .topics-section {
      max-width: 860px;
      margin: 0 auto 40px;
      padding: 0 24px;
    }
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .section-heading h2 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
    }
    .section-heading p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .topic-series {
      background: linear-gradient(135deg, rgba(96,165,250,0.08), rgba(167,139,250,0.06));
      border: 1px solid rgba(96,165,250,0.18);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .topic-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }
    .topic-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #f472b6;
      background: rgba(244,114,182,0.12);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .topic-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .topic-subtitle {
      font-size: 14px;
      color: var(--accent);
      font-weight: 600;
    }
    .topic-summary {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 16px;
    }
    .topic-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    .topic-stat {
      font-size: 12px;
      color: var(--text-secondary);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
    }
    .topic-stat strong {
      color: var(--text);
      font-weight: 700;
    }
    .topic-cover-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 18px;
    }
    .topic-cover-link:hover { color: #93c5fd; }
    .topic-chapters {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }
    .chapter-card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      min-height: 120px;
    }
    .chapter-card:hover {
      background: var(--card-hover);
      border-color: rgba(96,165,250,0.25);
      transform: translateY(-2px);
    }
    .chapter-order {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent2);
      margin-bottom: 6px;
    }
    .chapter-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .chapter-summary {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .chapter-meta {
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .podcast-section-heading {
      max-width: 860px;
      margin: 0 auto 20px;
      padding: 0 24px;
    }
    .podcast-section-heading h2 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
    }
    .podcast-section-heading p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ====== 搜索 ====== */
    .search-bar {
      max-width: 860px;
      margin: 0 auto 32px;
      padding: 0 24px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus {
      border-color: rgba(96,165,250,0.4);
      box-shadow: 0 0 0 3px rgba(96,165,250,0.1);
    }
    .search-icon {
      position: absolute;
      left: 40px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* ====== 筛选条（主题 / 作者） ====== */
    .filter-bar {
      max-width: 860px;
      margin: -8px auto 20px;
      padding: 0 24px;
    }
    .filter-bar + .filter-bar {
      margin-top: 0;
      margin-bottom: 28px;
    }
    .filter-bar-label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-chip {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      white-space: nowrap;
    }
    .filter-chip:hover {
      border-color: rgba(96,165,250,0.4);
      color: var(--text);
    }
    .filter-chip.active {
      background: rgba(96,165,250,0.15);
      border-color: rgba(96,165,250,0.6);
      color: #93c5fd;
    }
    .filter-chip.topic-chip.active {
      background: rgba(167,139,250,0.15);
      border-color: rgba(167,139,250,0.55);
      color: #c4b5fd;
    }
    .filter-chip .chip-count {
      opacity: 0.6;
      margin-left: 4px;
      font-size: 12px;
    }
    .filter-chip.more-chip {
      border-style: dashed;
      color: var(--accent);
    }

    /* ====== 模式切换 ====== */
    .mode-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 24px 20px;
    }
    .mode-tab {
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .mode-tab:hover {
      color: var(--text);
      border-color: rgba(96,165,250,0.4);
    }
    .mode-tab.active {
      background: rgba(96,165,250,0.15);
      border-color: rgba(96,165,250,0.55);
      color: #93c5fd;
    }
    .mode-tab .tab-count {
      opacity: 0.65;
      font-weight: 500;
      margin-left: 4px;
      font-size: 12px;
    }

    /* ====== 统一搜索结果 ====== */
    .unified-results {
      max-width: 860px;
      margin: 0 auto 28px;
      padding: 0 24px;
    }
    .unified-section {
      margin-bottom: 28px;
    }
    .unified-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 12px;
    }
    .unified-section-title .count-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(96,165,250,0.12);
      padding: 2px 10px;
      border-radius: 10px;
    }
    .unified-more {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
    }
    .unified-more:hover { text-decoration: underline; }
    .unified-empty {
      font-size: 13px;
      color: var(--text-muted);
      padding: 8px 0 4px;
    }
    .hit-card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 10px;
      text-decoration: none;
      color: inherit;
      transition: all .2s;
    }
    .hit-card:hover {
      background: var(--card-hover);
      border-color: rgba(255,255,255,0.15);
    }
    .hit-card .hit-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .hit-card .hit-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .hit-card .hit-snippet {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .hit-card mark {
      background: rgba(96,165,250,0.25);
      color: #93c5fd;
      border-radius: 3px;
      padding: 0 2px;
    }

    /* ====== 原文浏览 ====== */
    .transcripts-browse {
      max-width: 860px;
      margin: 0 auto 40px;
      padding: 0 24px;
    }
    .browse-hint {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      line-height: 1.7;
    }
    .browse-hint a { color: var(--accent); }

    .search-empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      font-size: 15px;
    }

    /* ====== 英文搜索结果 ====== */
    .en-results {
      max-width: 860px;
      margin: 0 auto 36px;
      padding: 0 24px;
    }
    .en-results-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 14px;
    }
    .en-results-title .count-badge {
      font-size: 12px;
      font-weight: 600;
      color: #34d399;
      background: rgba(52,211,153,0.12);
      padding: 2px 10px;
      border-radius: 10px;
    }
    .en-card .card-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .en-badge {
      font-size: 11px;
      font-weight: 700;
      color: #34d399;
      background: rgba(52,211,153,0.12);
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .en-snippet {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-top: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .en-snippet mark,
    .en-title-mark {
      background: rgba(96,165,250,0.28);
      color: #93c5fd;
      border-radius: 3px;
      padding: 0 2px;
    }
    .en-loc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    /* ====== 空状态 ====== */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
    }
    .empty-icon {
      font-size: 72px;
      margin-bottom: 20px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .empty-state h2 {
      font-size: 22px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .empty-state p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .empty-hint {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 24px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ====== 响应式 ====== */
    @media (max-width: 640px) {
      .hero h1 { font-size: 30px; }
      .hero { padding: 40px 16px 32px; }
      .stats-bar { gap: 24px; }
      .stat-num { font-size: 28px; }
      .timeline { padding-left: 32px; }
      .timeline::before { left: 12px; }
      .date-dot { left: -22px; width: 10px; height: 10px; }
      .date-label { font-size: 18px; }
      .card { padding: 18px; }

      .search-input { padding: 12px 16px 12px 40px; }

      .mode-tab { padding: 8px 14px; font-size: 13px; }
      .unified-results, .transcripts-browse { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>播客知识墙</h1>
    <p>先选意图再找内容 · 总结 / 专题 / 原文</p>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-item">
      <div class="stat-num" id="totalCount">0</div>
      <div class="stat-label">总总结</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="totalDuration">0h</div>
      <div class="stat-label">总时长</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="totalDays">0</div>
      <div class="stat-label">覆盖天数</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="totalTopics">0</div>
      <div class="stat-label">知识专题</div>
    </div>
  </div>

  <!-- 模式切换 -->
  <div class="mode-tabs" id="modeTabs" style="display:none;">
    <button type="button" class="mode-tab active" data-mode="summaries">找总结<span class="tab-count" id="tabCountSummaries"></span></button>
    <button type="button" class="mode-tab" data-mode="topics">找专题<span class="tab-count" id="tabCountTopics"></span></button>
    <button type="button" class="mode-tab" data-mode="transcripts">找原文<span class="tab-count" id="tabCountTranscripts"></span></button>
  </div>

  <!-- 搜索 -->
  <div class="search-bar" id="searchBar" style="display:none;">
    <span class="search-icon">&#x1F50D;</span>
    <input class="search-input" id="searchInput" type="text" placeholder="统一搜索：总结、专题、转录原文…">
  </div>

  <!-- 按主题筛选（仅总结模式） -->
  <div class="filter-bar" id="topicFilter" style="display:none;">
    <span class="filter-bar-label">按主题筛选</span>
    <div class="filter-chips" id="topicChips"></div>
  </div>

  <!-- 按作者筛选（仅总结模式） -->
  <div class="filter-bar" id="authorFilter" style="display:none;">
    <span class="filter-bar-label">按作者筛选</span>
    <div class="filter-chips" id="authorChips"></div>
  </div>

  <!-- 统一搜索结果 -->
  <div class="unified-results" id="unifiedResults" style="display:none;"></div>

  <!-- 知识专题 -->
  <div class="topics-section" id="topicsSection" style="display:none;">
    <div class="section-heading">
      <div>
        <h2>知识专题</h2>
        <p>方法论手册与系列长图，适合按问题进入</p>
      </div>
    </div>
    <div id="topicsContainer"></div>
  </div>

  <!-- 原文浏览 -->
  <div class="transcripts-browse" id="transcriptsBrowse" style="display:none;">
    <div class="section-heading">
      <div>
        <h2>转录原文</h2>
        <p class="browse-hint">按篇浏览，或在上方搜索框输入关键词做全文检索。也可打开 <a href="./transcripts.html">独立转录搜索页</a>。</p>
      </div>
    </div>
    <div id="transcriptsList"></div>
  </div>

  <!-- 播客标题 -->
  <div class="podcast-section-heading" id="podcastHeading" style="display:none;">
    <h2>播客总结</h2>
    <p>按时间浏览，或用主题 / 作者筛选</p>
  </div>

  <!-- 日历 -->
  <div class="calendar-wrapper" id="calendarWrapper" style="display:none;">
    <div class="cal-header">
      <button class="cal-nav-btn" id="calPrev">&larr;</button>
      <span class="cal-title" id="calTitle"></span>
      <button class="cal-nav-btn" id="calNext">&rarr;</button>
    </div>
    <div class="cal-grid">
      <div class="cal-day-header">日</div>
      <div class="cal-day-header">一</div>
      <div class="cal-day-header">二</div>
      <div class="cal-day-header">三</div>
      <div class="cal-day-header">四</div>
      <div class="cal-day-header">五</div>
      <div class="cal-day-header">六</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <button class="cal-today-btn" id="calToday">回到今天</button>
  </div>

  <!-- 主内容 -->
  <div class="container" id="mainContainer">
    <div class="empty-state" id="emptyState">
      <span class="empty-icon">&#x1F4ED;</span>
      <h2>还没有内容</h2>
      <p>提交播客链接生成总结，或添加知识专题长图</p>
      <div class="empty-hint">curl -X POST &lt;webhook-url&gt; -d '{"url":"..."}'</div>
    </div>
    <div class="timeline" id="timeline" style="display:none;"></div>
    <!-- 英文搜索结果 -->
    <div class="en-results" id="enResults" style="display:none;">
      <div class="en-results-title" id="enResultsTitle"></div>
      <div id="enResultsContainer"></div>
    </div>
    <div class="search-empty" id="searchEmpty" style="display:none;">没有找到匹配的内容</div>
  </div>

  <script>
    (function() {
      let allData = [];
      let allTopics = [];
      let enIndex = [];
      let transcriptIndex = null;
      let transcriptTextCache = {};
      let enHitCount = 0;
      let dateMap = {};
      let calYear, calMonth;
      let selectedAuthor = '';
      let selectedTopic = '';
      let viewMode = 'summaries'; // summaries | topics | transcripts
      let authorExpanded = false;
      let searchTimer = null;
      const AUTHOR_TOP_N = 8;
      const TRANSCRIPT_SEARCH_CAP = 24;

      const $ = id => document.getElementById(id);

      /** 播客主题分类：按标签/标题/摘要关键词归属（可多主题） */
      const TOPIC_CATEGORIES = [
        { id: '科技·AI', keywords: ['AI','人工智能','大模型','科技','芯片','TPU','RAG','蒸馏','算法','编程','软件','互联网','云计算','模型','OpenAI','DeepSeek','智能体','机器人','传感器'] },
        { id: '汽车·出行', keywords: ['汽车','新能源','智能驾驶','电动车','电池','OTA','车贷','车展','Model Y','比亚迪','小鹏','特斯拉','智驾'] },
        { id: '商业·消费', keywords: ['商业','消费','品牌','零售','营销','创业','资本','投资','经济','溢价','义乌','增长','商业模式','公关','搞钱','深圳'] },
        { id: '摄影·影像', keywords: ['摄影','相机','影像','徕卡','胶片','镜头','拍照','Leica'] },
        { id: '旅行·户外', keywords: ['旅行','户外','徒步','登山','旅游','日本生活','日本文化','日本','出行','环球','尼泊尔','冈仁波齐'] },
        { id: '生活·文化', keywords: ['生活','文化','文学','历史','音乐','古典音乐','读书','电影','艺术','审美','张爱玲','哲学'] },
        { id: '成长·职场', keywords: ['自我成长','职场','心理','心理学','成长','管理','组织','沟通','教育','学习','简历','求职','毕业','社会化'] },
        { id: '健康·运动', keywords: ['健康','运动','减肥','营养','孕期','医学','科学','足球','世界杯','体育','健身','基因治疗'] },
        { id: '美食·咖啡', keywords: ['咖啡','美食','餐饮','茶','食品','意大利菜','饮食','餐桌'] },
        { id: '社会·法律', keywords: ['法律','维权','婚姻','家事','伦理','罪案','社会','医疗','安全'] },
        { id: '家居·设计', keywords: ['家居','设计','IKEA','宜家','装修','空间'] }
      ];

      function itemTopicBlob(item) {
        return [
          (item.tags || []).join(' '),
          item.title || '',
          item.summary || '',
          item.author || ''
        ].join(' ');
      }

      function inferTopics(item) {
        const blob = itemTopicBlob(item);
        const lower = blob.toLowerCase();
        const hits = [];
        TOPIC_CATEGORIES.forEach(function(cat) {
          for (let i = 0; i < cat.keywords.length; i++) {
            const kw = cat.keywords[i];
            if (lower.indexOf(kw.toLowerCase()) !== -1) {
              hits.push(cat.id);
              return;
            }
          }
        });
        return hits.length ? hits : ['其他'];
      }

      function itemMatchesTopic(item, topic) {
        if (!topic) return true;
        return inferTopics(item).indexOf(topic) !== -1;
      }

      function itemMatchesFilters(item, query) {
        if (selectedAuthor && (item.author || '未署名') !== selectedAuthor) return false;
        if (!itemMatchesTopic(item, selectedTopic)) return false;
        if (!query) return true;
        return (item.title || '').toLowerCase().includes(query) ||
          (item.title_en || '').toLowerCase().includes(query) ||
          (item.summary || '').toLowerCase().includes(query) ||
          (item.url || '').toLowerCase().includes(query) ||
          (item.error_message || '').toLowerCase().includes(query) ||
          (item.author || '').toLowerCase().includes(query) ||
          (item.tags || []).join(' ').toLowerCase().includes(query);
      }

      function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s || '';
        return d.innerHTML;
      }

      function viewerUrl(filename) {
        // .html 专题文件直接打开，SVG 走 viewer
        return /\.html$/i.test(filename)
          ? filename
          : 'viewer.html?f=' + encodeURIComponent(filename);
      }

      const TAG_COLORS = ['tag-blue','tag-purple','tag-green','tag-orange'];

      const DISPLAY_SPREAD_THRESHOLD = 3;
      const DISPLAY_RANGE_DAYS = 7;

      function hashString(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = ((hash << 5) - hash) + str.charCodeAt(i);
          hash |= 0;
        }
        return Math.abs(hash);
      }

      function toDateKey(date) {
        return date.getFullYear() + '-' +
          String(date.getMonth() + 1).padStart(2, '0') + '-' +
          String(date.getDate()).padStart(2, '0');
      }

      /** 同一天条目过多时，仅将超出阈值的条目用稳定哈希分散到过去 7 天内展示 */
      function applyDisplayDates(items) {
        const counts = {};
        items.forEach(item => {
          const d = item.date || '';
          counts[d] = (counts[d] || 0) + 1;
        });

        const spreadDates = new Set(
          Object.keys(counts).filter(d => counts[d] > DISPLAY_SPREAD_THRESHOLD)
        );

        if (spreadDates.size === 0) {
          items.forEach(item => { item.displayDate = item.date; });
          return;
        }

        const keptOnDate = {};

        items.forEach(item => {
          const d = item.date || '';
          if (!spreadDates.has(d)) {
            item.displayDate = d;
            return;
          }
          const kept = keptOnDate[d] || 0;
          if (kept < DISPLAY_SPREAD_THRESHOLD) {
            item.displayDate = d;
            keptOnDate[d] = kept + 1;
            return;
          }
          // 以条目自身日期为锚点，而非“今天”，避免展示日期每天漂移
          const anchor = new Date(d + 'T00:00:00');
          const startDate = new Date(anchor);
          startDate.setDate(startDate.getDate() - (DISPLAY_RANGE_DAYS - 1));
          const seed = hashString(item.url || item.filename || item.title || '');
          const dayOffset = seed % DISPLAY_RANGE_DAYS;
          const disp = new Date(startDate);
          disp.setDate(disp.getDate() + dayOffset);
          item.displayDate = toDateKey(disp);
        });
      }

      async function loadData() {
        try {
          const resp = await fetch('index.json');
          if (!resp.ok) throw new Error('Failed');
          allData = await resp.json();
        } catch (e) {
          allData = [];
        }
        try {
          const resp = await fetch('topics.json');
          if (!resp.ok) throw new Error('Failed');
          allTopics = await resp.json();
        } catch (e) {
          allTopics = [];
        }
        try {
          const resp = await fetch('en-index.json');
          if (!resp.ok) throw new Error('Failed');
          enIndex = await resp.json();
        } catch (e) {
          enIndex = [];
        }
        try {
          const resp = await fetch('transcripts-index.json');
          if (!resp.ok) throw new Error('Failed');
          transcriptIndex = await resp.json();
        } catch (e) {
          transcriptIndex = { count: 0, items: [] };
        }
        buildDateMap();
        bindModeTabs();
        render();
      }

      function bindModeTabs() {
        document.querySelectorAll('.mode-tab').forEach(function(btn) {
          btn.addEventListener('click', function() {
            viewMode = btn.getAttribute('data-mode') || 'summaries';
            document.querySelectorAll('.mode-tab').forEach(function(b) {
              b.classList.toggle('active', b.getAttribute('data-mode') === viewMode);
            });
            render();
          });
        });
      }

      function buildDateMap() {
        dateMap = {};
        applyDisplayDates(allData);
        allData.forEach(item => {
          const d = item.displayDate || item.date || '';
          if (!dateMap[d]) dateMap[d] = [];
          dateMap[d].push(item);
        });
      }

      function buildTopicChips() {
        const container = $('topicChips');
        container.innerHTML = '';
        const counts = {};
        TOPIC_CATEGORIES.forEach(function(cat) { counts[cat.id] = 0; });
        counts['其他'] = 0;

        allData.forEach(function(item) {
          inferTopics(item).forEach(function(t) {
            counts[t] = (counts[t] || 0) + 1;
          });
        });

        const topics = TOPIC_CATEGORIES.map(function(c) { return c.id; })
          .concat(['其他'])
          .filter(function(t) { return counts[t] > 0; });

        if (topics.length === 0) return;
        $('topicFilter').style.display = 'block';

        const allChip = document.createElement('button');
        allChip.className = 'filter-chip topic-chip' + (selectedTopic === '' ? ' active' : '');
        allChip.textContent = '全部 ' + allData.length;
        allChip.addEventListener('click', function() {
          selectedTopic = '';
          render();
        });
        container.appendChild(allChip);

        topics.forEach(function(topic) {
          const chip = document.createElement('button');
          chip.className = 'filter-chip topic-chip' + (selectedTopic === topic ? ' active' : '');
          chip.innerHTML = escapeHtml(topic) + '<span class="chip-count">' + counts[topic] + '</span>';
          chip.addEventListener('click', function() {
            selectedTopic = (selectedTopic === topic) ? '' : topic;
            render();
          });
          container.appendChild(chip);
        });
      }

      function buildAuthorChips() {
        const container = $('authorChips');
        container.innerHTML = '';
        const counts = {};
        allData.forEach(item => {
          const a = item.author || '未署名';
          counts[a] = (counts[a] || 0) + 1;
        });
        const authors = Object.keys(counts).sort((a, b) =>
          counts[b] - counts[a] || a.localeCompare(b, 'zh-CN')
        );
        if (authors.length === 0) return;

        $('authorFilter').style.display = 'block';

        const allChip = document.createElement('button');
        allChip.className = 'filter-chip' + (selectedAuthor === '' ? ' active' : '');
        allChip.textContent = '全部 ' + allData.length;
        allChip.addEventListener('click', function() {
          selectedAuthor = '';
          render();
        });
        container.appendChild(allChip);

        const visible = authorExpanded ? authors : authors.slice(0, AUTHOR_TOP_N);
        visible.forEach(author => {
          const chip = document.createElement('button');
          chip.className = 'filter-chip' + (selectedAuthor === author ? ' active' : '');
          chip.innerHTML = escapeHtml(author) + '<span class="chip-count">' + counts[author] + '</span>';
          chip.addEventListener('click', function() {
            selectedAuthor = (selectedAuthor === author) ? '' : author;
            render();
          });
          container.appendChild(chip);
        });

        if (selectedAuthor && !authorExpanded && authors.indexOf(selectedAuthor) >= AUTHOR_TOP_N) {
          const chip = document.createElement('button');
          chip.className = 'filter-chip active';
          chip.innerHTML = escapeHtml(selectedAuthor) + '<span class="chip-count">' + counts[selectedAuthor] + '</span>';
          chip.addEventListener('click', function() {
            selectedAuthor = '';
            render();
          });
          container.appendChild(chip);
        }

        if (authors.length > AUTHOR_TOP_N) {
          const more = document.createElement('button');
          more.className = 'filter-chip more-chip';
          more.textContent = authorExpanded
            ? '收起作者'
            : ('更多作者 +' + (authors.length - AUTHOR_TOP_N));
          more.addEventListener('click', function() {
            authorExpanded = !authorExpanded;
            buildAuthorChips();
          });
          container.appendChild(more);
        }
      }

      function filterTopics(query) {
        return allTopics.filter(function(topic) {
          if (!query) return true;
          const haystack = [
            topic.title,
            topic.subtitle,
            topic.summary,
            (topic.tags || []).join(' ')
          ].concat((topic.items || []).map(function(item) {
            return [item.title, item.summary].join(' ');
          })).join(' ').toLowerCase();
          return haystack.indexOf(query) !== -1;
        });
      }

      function filterSummaries(query) {
        return allData.filter(function(item) {
          return itemMatchesFilters(item, query);
        });
      }

      function matchTranscriptMeta(item, q) {
        if (!q) return true;
        const hay = [
          item.title, item.author, item.date,
          (item.tags || []).join(' ')
        ].join(' ').toLowerCase();
        return hay.indexOf(q) !== -1;
      }

      async function searchTranscriptSnippet(item, q) {
        let text = transcriptTextCache[item.slug];
        if (text === undefined) {
          try {
            const resp = await fetch(item.file);
            text = await resp.text();
          } catch (e) {
            text = '';
          }
          transcriptTextCache[item.slug] = text;
        }
        if (!text) return null;
        const lower = text.toLowerCase();
        const idx = lower.indexOf(q);
        if (idx === -1) return null;
        const start = Math.max(0, idx - 50);
        const end = Math.min(text.length, idx + q.length + 70);
        const slice = (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
        return highlight(escapeHtml(slice), q);
      }

      function renderTranscriptsBrowse() {
        const list = $('transcriptsList');
        list.innerHTML = '';
        const items = (transcriptIndex && transcriptIndex.items) ? transcriptIndex.items.slice() : [];
        items.sort(function(a, b) {
          return String(b.date || '').localeCompare(String(a.date || ''));
        });
        if (!items.length) {
          list.innerHTML = '<p class="unified-empty">暂无转录索引</p>';
          return;
        }
        items.slice(0, 40).forEach(function(item) {
          const a = document.createElement('a');
          a.className = 'hit-card';
          a.href = 'transcript-viewer.html?slug=' + encodeURIComponent(item.slug);
          a.target = '_blank';
          a.innerHTML =
            '<div class="hit-title">' + escapeHtml(item.title || item.slug) + '</div>' +
            '<div class="hit-meta">' +
              escapeHtml([item.author, item.date, item.duration].filter(Boolean).join(' · ')) +
            '</div>';
          list.appendChild(a);
        });
        if (items.length > 40) {
          const more = document.createElement('p');
          more.className = 'browse-hint';
          more.innerHTML = '仅展示最近 40 篇。完整列表与全文搜索见 <a href="./transcripts.html">转录搜索页</a>。';
          list.appendChild(more);
        }
      }

      async function renderUnifiedSearch(query) {
        const wrap = $('unifiedResults');
        wrap.style.display = 'block';
        wrap.innerHTML = '<p class="unified-empty">正在搜索…</p>';

        const topicHits = filterTopics(query);
        const summaryHits = filterSummaries(query);

        let html = '';

        html += '<div class="unified-section"><div class="unified-section-title">' +
          '<span>知识专题 <span class="count-badge">' + topicHits.length + '</span></span>' +
          (viewMode !== 'topics' ? '<button type="button" class="unified-more" data-jump="topics">只看专题</button>' : '') +
          '</div>';
        if (!topicHits.length) {
          html += '<p class="unified-empty">无专题命中</p>';
        } else {
          topicHits.forEach(function(topic) {
            const href = viewerUrl(topic.cover || ((topic.items && topic.items[0] && topic.items[0].filename) || '#'));
            html += '<a class="hit-card" href="' + escapeHtml(href) + '" target="_blank">' +
              '<div class="hit-title">' + highlight(escapeHtml(topic.title || ''), query) + '</div>' +
              '<div class="hit-meta">' + escapeHtml(topic.subtitle || '') + '</div>' +
              '<div class="hit-snippet">' + highlight(escapeHtml((topic.summary || '').slice(0, 140)), query) + '</div>' +
              '</a>';
          });
        }
        html += '</div>';

        html += '<div class="unified-section"><div class="unified-section-title">' +
          '<span>播客总结 <span class="count-badge">' + summaryHits.length + '</span></span>' +
          (viewMode !== 'summaries' ? '<button type="button" class="unified-more" data-jump="summaries">只看总结</button>' : '') +
          '</div>';
        if (!summaryHits.length) {
          html += '<p class="unified-empty">无总结命中</p>';
        } else {
          summaryHits.slice(0, 20).forEach(function(item) {
            const dest = item.error
              ? (item.url || '#')
              : (item.filename || '').replace(/\.svg$/i, '.html');
            html += '<a class="hit-card" href="' + escapeHtml(dest) + '" target="_blank">' +
              '<div class="hit-title">' + highlight(escapeHtml(item.title || ''), query) + '</div>' +
              '<div class="hit-meta">' + escapeHtml([item.author, item.date].filter(Boolean).join(' · ')) + '</div>' +
              '<div class="hit-snippet">' + highlight(escapeHtml((item.summary || '').slice(0, 140)), query) + '</div>' +
              '</a>';
          });
          if (summaryHits.length > 20) {
            html += '<p class="unified-empty">另有 ' + (summaryHits.length - 20) + ' 条，可切到「找总结」并配合筛选查看</p>';
          }
        }
        html += '</div>';

        // 转录：先元数据，再对前若干篇做全文
        const tItems = (transcriptIndex && transcriptIndex.items) ? transcriptIndex.items : [];
        const metaHits = tItems.filter(function(item) { return matchTranscriptMeta(item, query); });
        const candidates = metaHits.length ? metaHits : tItems.slice(0, TRANSCRIPT_SEARCH_CAP);
        const toScan = candidates.slice(0, TRANSCRIPT_SEARCH_CAP);

        wrap.innerHTML = html +
          '<div class="unified-section" id="unifiedTranscriptSection">' +
          '<div class="unified-section-title"><span>转录原文 <span class="count-badge">…</span></span>' +
          '<a class="unified-more" href="./transcripts.html?q=' + encodeURIComponent(query) + '">打开全文搜索页</a></div>' +
          '<p class="unified-empty">正在检索原文…</p></div>';

        wrap.querySelectorAll('[data-jump]').forEach(function(btn) {
          btn.addEventListener('click', function() {
            viewMode = btn.getAttribute('data-jump');
            document.querySelectorAll('.mode-tab').forEach(function(b) {
              b.classList.toggle('active', b.getAttribute('data-mode') === viewMode);
            });
            $('searchInput').value = query;
            render();
          });
        });

        const fullHits = [];
        for (let i = 0; i < toScan.length; i++) {
          const item = toScan[i];
          const snip = await searchTranscriptSnippet(item, query);
          if (snip) fullHits.push({ item: item, snippet: snip });
          if (fullHits.length >= 8) break;
        }

        // 若全文无果但元数据有，也展示元数据命中
        let tHtml = '<div class="unified-section-title"><span>转录原文 <span class="count-badge">' +
          (fullHits.length || metaHits.length) + '</span></span>' +
          '<a class="unified-more" href="./transcripts.html?q=' + encodeURIComponent(query) + '">打开全文搜索页</a></div>';
        if (fullHits.length) {
          fullHits.forEach(function(r) {
            tHtml += '<a class="hit-card" href="transcript-viewer.html?slug=' + encodeURIComponent(r.item.slug) +
              '&q=' + encodeURIComponent(query) + '" target="_blank">' +
              '<div class="hit-title">' + highlight(escapeHtml(r.item.title || r.item.slug), query) + '</div>' +
              '<div class="hit-meta">' + escapeHtml([r.item.author, r.item.date].filter(Boolean).join(' · ')) + '</div>' +
              '<div class="hit-snippet">' + r.snippet + '</div></a>';
          });
        } else if (metaHits.length) {
          metaHits.slice(0, 8).forEach(function(item) {
            tHtml += '<a class="hit-card" href="transcript-viewer.html?slug=' + encodeURIComponent(item.slug) +
              '" target="_blank">' +
              '<div class="hit-title">' + highlight(escapeHtml(item.title || item.slug), query) + '</div>' +
              '<div class="hit-meta">' + escapeHtml([item.author, item.date].filter(Boolean).join(' · ')) + '</div>' +
              '<div class="hit-snippet">标题/标签命中 · 点开阅读原文</div></a>';
          });
        } else {
          tHtml += '<p class="unified-empty">无原文命中（可到全文搜索页扩大检索）</p>';
        }
        const sec = $('unifiedTranscriptSection');
        if (sec) sec.innerHTML = tHtml;

        const anyHit = topicHits.length || summaryHits.length || fullHits.length || metaHits.length;
        $('searchEmpty').style.display = anyHit ? 'none' : '';
        return anyHit;
      }

      function render() {
        const hasPodcasts = allData.length > 0;
        const hasTopics = allTopics.length > 0;
        const hasTranscripts = !!(transcriptIndex && transcriptIndex.items && transcriptIndex.items.length);
        const hasData = hasPodcasts || hasTopics || hasTranscripts;

        $('modeTabs').style.display = hasData ? 'flex' : 'none';
        $('searchBar').style.display = hasData ? 'block' : 'none';
        $('tabCountSummaries').textContent = hasPodcasts ? allData.length : '';
        $('tabCountTopics').textContent = hasTopics ? allTopics.length : '';
        $('tabCountTranscripts').textContent = hasTranscripts ? transcriptIndex.count : '';

        if (!hasData) {
          $('emptyState').style.display = '';
          $('timeline').style.display = 'none';
          $('searchEmpty').style.display = 'none';
          $('unifiedResults').style.display = 'none';
          $('topicsSection').style.display = 'none';
          $('transcriptsBrowse').style.display = 'none';
          $('calendarWrapper').style.display = 'none';
          $('podcastHeading').style.display = 'none';
          $('topicFilter').style.display = 'none';
          $('authorFilter').style.display = 'none';
          updateStats(0, 0);
          return;
        }

        $('emptyState').style.display = 'none';
        const query = $('searchInput').value.trim().toLowerCase();

        // 有搜索词：统一结果，隐藏浏览区
        if (query) {
          $('topicsSection').style.display = 'none';
          $('transcriptsBrowse').style.display = 'none';
          $('calendarWrapper').style.display = 'none';
          $('podcastHeading').style.display = 'none';
          $('topicFilter').style.display = 'none';
          $('authorFilter').style.display = 'none';
          $('timeline').style.display = 'none';
          renderEnResults(query);
          renderUnifiedSearch(query);
          updateStats(allData.length, Object.keys(dateMap).length);
          $('totalTopics').textContent = allTopics.length;
          return;
        }

        $('unifiedResults').style.display = 'none';
        $('searchEmpty').style.display = 'none';
        $('enResults').style.display = 'none';

        const showSummaries = viewMode === 'summaries';
        const showTopics = viewMode === 'topics';
        const showTranscripts = viewMode === 'transcripts';

        $('topicsSection').style.display = showTopics && hasTopics ? 'block' : 'none';
        $('transcriptsBrowse').style.display = showTranscripts && hasTranscripts ? 'block' : 'none';
        $('calendarWrapper').style.display = showSummaries && hasPodcasts ? 'block' : 'none';
        $('podcastHeading').style.display = showSummaries && hasPodcasts ? 'block' : 'none';

        if (showSummaries && hasPodcasts) {
          buildTopicChips();
          buildAuthorChips();
          renderPodcasts('');
        } else {
          $('topicFilter').style.display = 'none';
          $('authorFilter').style.display = 'none';
          $('timeline').style.display = 'none';
          updateStats(allData.length, Object.keys(dateMap).length);
        }

        if (showTopics && hasTopics) {
          buildTopics('');
          $('totalTopics').textContent = allTopics.length;
        } else {
          $('totalTopics').textContent = allTopics.length;
        }

        if (showTranscripts && hasTranscripts) {
          renderTranscriptsBrowse();
        }
      }

      function buildTopics(query) {
        const container = $('topicsContainer');
        container.innerHTML = '';

        const filteredTopics = allTopics.filter(function(topic) {
          if (!query) return true;
          const haystack = [
            topic.title,
            topic.subtitle,
            topic.summary,
            (topic.tags || []).join(' ')
          ].concat((topic.items || []).map(function(item) {
            return [item.title, item.summary].join(' ');
          })).join(' ').toLowerCase();
          return haystack.indexOf(query) !== -1;
        });

        $('totalTopics').textContent = filteredTopics.length;

        filteredTopics.forEach(function(topic) {
          const series = document.createElement('div');
          series.className = 'topic-series';

          const stats = topic.stats || {};
          const statsHtml = [
            stats.lessons ? '<span class="topic-stat"><strong>' + stats.lessons + '</strong> 节课</span>' : '',
            stats.images ? '<span class="topic-stat"><strong>' + stats.images + '</strong> 张长图</span>' : '',
            stats.doctors ? '<span class="topic-stat"><strong>' + stats.doctors + '</strong> 位医生</span>' : '',
            stats.podcasts ? '<span class="topic-stat">跨 <strong>' + stats.podcasts + '</strong> 档播客</span>' : '',
            stats.cards ? '<span class="topic-stat"><strong>' + stats.cards + '</strong> ' + (stats.cards_label || '条话术') + '</span>' : '',
            stats.types ? '<span class="topic-stat"><strong>' + stats.types + '</strong> ' + (stats.types_label || '类话术') + '</span>' : '',
            stats.duration ? '<span class="topic-stat">总时长 <strong>' + escapeHtml(stats.duration) + '</strong></span>' : ''
          ].filter(Boolean).join('');

          let tagsHtml = '';
          if (topic.tags && topic.tags.length > 0) {
            tagsHtml = '<div class="card-tags" style="margin-top:0;margin-bottom:12px">' +
              topic.tags.map(function(t, i) {
                return '<span class="card-tag ' + TAG_COLORS[i % TAG_COLORS.length] + '">' + escapeHtml(t) + '</span>';
              }).join('') +
              '</div>';
          }

          series.innerHTML =
            '<div class="topic-header">' +
              '<div>' +
                '<div class="topic-badge">知识专题</div>' +
                '<div class="topic-title">' + escapeHtml(topic.title) + '</div>' +
                (topic.subtitle ? '<div class="topic-subtitle">' + escapeHtml(topic.subtitle) + '</div>' : '') +
              '</div>' +
            '</div>' +
            tagsHtml +
            '<div class="topic-summary">' + escapeHtml(topic.summary || '') + '</div>' +
            (statsHtml ? '<div class="topic-stats">' + statsHtml + '</div>' : '') +
            (topic.cover ? '<a class="topic-cover-link" href="' + escapeHtml(viewerUrl(topic.cover)) + '" target="_blank">📖 打开总目录 →</a>' : '');

          const chapters = document.createElement('div');
          chapters.className = 'topic-chapters';

          (topic.items || []).forEach(function(item) {
            if (item.order === 0) return;
            if (query) {
              const itemHaystack = ((item.title || '') + ' ' + (item.summary || '')).toLowerCase();
              const topicHaystack = [
                topic.title,
                topic.subtitle,
                topic.summary,
                (topic.tags || []).join(' ')
              ].join(' ').toLowerCase();
              if (itemHaystack.indexOf(query) === -1 && topicHaystack.indexOf(query) === -1) return;
            }

            const card = document.createElement('a');
            card.className = 'chapter-card';
            card.href = viewerUrl(item.filename);
            card.target = '_blank';
            card.innerHTML =
              '<div class="chapter-order">第 ' + String(item.order).padStart(2, '0') + ' 篇</div>' +
              '<div class="chapter-title">' + escapeHtml(item.title) + '</div>' +
              '<div class="chapter-summary">' + escapeHtml(item.summary || '') + '</div>' +
              (item.lessons ? '<div class="chapter-meta">' + item.lessons + ' 节课</div>' : '');

            chapters.appendChild(card);
          });

          series.appendChild(chapters);
          container.appendChild(series);
        });
      }

      function topicMatchesQuery(query) {
        return allTopics.some(function(topic) {
          const haystack = [
            topic.title,
            topic.subtitle,
            topic.summary,
            (topic.tags || []).join(' ')
          ].concat((topic.items || []).map(function(item) {
            return [item.title, item.summary].join(' ');
          })).join(' ').toLowerCase();
          return haystack.indexOf(query) !== -1;
        });
      }

      function escapeRegExp(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      /** 大小写不敏感地把命中词包进 <mark>（text 需已 HTML 转义或纯文本） */
      function highlight(text, query) {
        if (!query) return text;
        const re = new RegExp('(' + escapeRegExp(query) + ')', 'gi');
        return text.replace(re, '<mark>$1</mark>');
      }

      /** 以首个命中处为中心截取片段并高亮 */
      function makeSnippet(text, query) {
        const lower = text.toLowerCase();
        const idx = lower.indexOf(query);
        let slice;
        if (idx === -1) {
          slice = text.slice(0, 160);
        } else {
          const start = Math.max(0, idx - 60);
          const end = Math.min(text.length, idx + query.length + 120);
          slice = (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
        }
        return highlight(escapeHtml(slice), query);
      }

      function renderEnResults(query) {
        const container = $('enResultsContainer');
        const wrap = $('enResults');
        enHitCount = 0;

        const isLatin = /[a-zA-Z]/.test(query);
        if (!query || !isLatin || enIndex.length === 0) {
          wrap.style.display = 'none';
          container.innerHTML = '';
          return;
        }

        let hits = [];
        enIndex.forEach(function(entry) {
          const titleLower = (entry.title_en || '').toLowerCase();
          const titleHit = titleLower.indexOf(query) !== -1;
          const blockHits = (entry.blocks || []).filter(function(b) {
            return (b.text || '').toLowerCase().indexOf(query) !== -1;
          });
          if (!titleHit && blockHits.length === 0) return;
          hits.push({ entry: entry, titleHit: titleHit, blockHits: blockHits });
        });

        enHitCount = hits.length;
        if (hits.length === 0) {
          wrap.style.display = 'none';
          container.innerHTML = '';
          return;
        }

        wrap.style.display = 'block';
        $('enResultsTitle').innerHTML = '英文内容 <span class="count-badge">' + hits.length + ' 篇命中</span>';

        hits.forEach(function(h) {
          const entry = h.entry;
          const firstBlock = h.blockHits[0];
          const anchor = firstBlock && firstBlock.anchor ? firstBlock.anchor : '';
          const href = entry.en_page + (anchor ? '#' + anchor : '');

          const titleHtml = h.titleHit
            ? highlight(escapeHtml(entry.title_en), query)
            : escapeHtml(entry.title_en);

          let snippetText, locLabel;
          if (firstBlock) {
            snippetText = makeSnippet(firstBlock.text, query);
            locLabel = (firstBlock.label || '内容') + ' · ' + entry.en_page + (anchor ? ' #' + anchor : '');
          } else {
            snippetText = makeSnippet(entry.title_en, query);
            locLabel = '英文标题 · ' + entry.en_page;
          }

          const card = document.createElement('a');
          card.className = 'card en-card';
          card.href = href;
          card.target = '_blank';
          card.innerHTML =
            '<div class="card-header">' +
              '<span class="card-title">' + titleHtml + '<span class="en-badge">EN</span></span>' +
            '</div>' +
            '<div class="en-snippet">' + snippetText + '</div>' +
            '<div class="en-loc">' + escapeHtml(locLabel) + '</div>' +
            '<span class="card-link-icon">&#x2197;</span>';
          container.appendChild(card);
        });
      }

      function renderPodcasts(query) {
        const days = Object.keys(dateMap).sort().reverse();
        updateStats(allData.length, days.length);

        let filteredDays = days;
        let visibleCount = 0;
        const hasFilter = !!(query || selectedAuthor || selectedTopic);

        if (hasFilter) {
          filteredDays = days.filter(function(d) {
            const items = dateMap[d].filter(function(item) {
              return itemMatchesFilters(item, query);
            });
            dateMap[d]._filtered = items;
            if (items.length > 0) visibleCount++;
            return items.length > 0;
          });
        } else {
          days.forEach(function(d) { dateMap[d]._filtered = dateMap[d]; });
        }

        if (hasFilter && visibleCount === 0 && !topicMatchesQuery(query) && enHitCount === 0) {
          $('timeline').style.display = 'none';
          $('searchEmpty').style.display = '';
        } else {
          $('timeline').style.display = hasFilter && visibleCount === 0 ? 'none' : '';
          $('searchEmpty').style.display = 'none';
          if (!hasFilter || visibleCount > 0) buildTimeline(filteredDays);
        }

        buildCalendar();
      }

      function buildTimeline(days) {
        const tl = $('timeline');
        tl.innerHTML = '';

        if (days.length === 0) return;

        const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];

        days.forEach(dateStr => {
          const items = dateMap[dateStr]._filtered || dateMap[dateStr];
          if (items.length === 0) return;

          const d = new Date(dateStr + 'T00:00:00');
          const display = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
          const wd = WEEKDAYS[d.getDay()];

          const group = document.createElement('div');
          group.className = 'date-group';

          group.innerHTML = '<div class="date-dot"></div>';

          const label = document.createElement('div');
          label.className = 'date-label';
          label.innerHTML = '<span>' + display + '</span><span class="weekday">' + wd + '</span><span class="count-badge">' + items.length + ' 期</span>';
          group.appendChild(label);

          items.forEach(item => {
            var isError = item.error;
            const card = document.createElement('div');
            card.className = 'card' + (isError ? ' card-error' : '');
            card.style.cursor = 'pointer';
            card.setAttribute('role', 'link');
            card.setAttribute('tabindex', '0');
            card.addEventListener('click', function(e) {
              if (e.target.closest('a')) return; // 内部链接自行处理
              var dest = isError
                ? (item.url || '#')
                : item.filename.replace(/\.svg$/i, '.html'); // 默认打开 HTML 版
              window.open(dest, '_blank');
            });
            card.addEventListener('keydown', function(e) {
              if (e.key === 'Enter') {
                var dest = isError
                  ? (item.url || '#')
                  : item.filename.replace(/\.svg$/i, '.html');
                window.open(dest, '_blank');
              }
            });

            let tagsHtml = '';
            if (item.tags && item.tags.length > 0) {
              tagsHtml = '<div class="card-tags">' +
                item.tags.map((t, i) => '<span class="card-tag ' + TAG_COLORS[i % TAG_COLORS.length] + '">' + escapeHtml(t) + '</span>').join('') +
                '</div>';
            }

            var titleText = isError
              ? '⚠ ' + escapeHtml(item.title || '处理失败')
              : escapeHtml(item.title || item.filename.replace('.svg',''));

            var summaryText = isError
              ? escapeHtml(item.error_message || '未能成功生成总结')
              : escapeHtml(item.summary || '');

            var sourceLink = (item.url && !isError)
              ? '<a class="card-source-link" href="' + escapeHtml(item.url) + '" target="_blank">📎 原文链接</a>'
              : '';

            var enSlug = (!isError && item.filename)
              ? item.filename.replace(/-(?:播客)?总结\.svg$/i, '')
              : '';
            var enLink = (item.en && enSlug)
              ? '<a class="card-source-link card-en-link" href="' + escapeHtml(enSlug + '-en.html') + '" target="_blank">🌐 EN 双语版</a>'
              : '';

            var durationHtml = (item.duration && !isError)
              ? '<span class="card-duration">⏱ ' + escapeHtml(item.duration) + '</span>'
              : '';

            var authorHtml = (!isError && item.author)
              ? '<span class="card-author">' + escapeHtml(item.author) + '</span>'
              : '';

            card.innerHTML =
              '<div class="card-header">' +
                '<span class="card-title">' + titleText + '</span>' +
              '</div>' +
              '<div class="card-summary">' + summaryText + '</div>' +
              authorHtml +
              tagsHtml +
              durationHtml +
              '<div class="card-links">' + sourceLink + enLink + '</div>' +
              '<span class="card-link-icon">&#x2197;</span>';

            group.appendChild(card);
          });

          tl.appendChild(group);
        });
      }

      function buildCalendar() {
        const now = new Date();
        if (calYear === undefined) { calYear = now.getFullYear(); calMonth = now.getMonth(); }

        const year = calYear, month = calMonth;
        $('calTitle').textContent = year + '年' + (month + 1) + '月';

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const prevMonthDays = new Date(year, month, 0).getDate();

        const today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');

        const grid = $('calGrid');
        grid.innerHTML = '';

        for (let i = firstDay - 1; i >= 0; i--) {
          const d = prevMonthDays - i;
          const cell = document.createElement('div');
          cell.className = 'cal-day other-month';
          cell.textContent = d;
          grid.appendChild(cell);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dateKey = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
          const cell = document.createElement('div');
          cell.className = 'cal-day';
          cell.textContent = d;

          if (dateMap[dateKey]) {
            cell.classList.add('has-data');
            cell.title = dateMap[dateKey].length + ' 期总结';
            cell.addEventListener('click', function() { scrollToDate(dateKey); });
          }
          if (dateKey === today) {
            cell.classList.add('today');
          }

          grid.appendChild(cell);
        }

        const remaining = 42 - firstDay - daysInMonth;
        for (let d = 1; d <= remaining; d++) {
          const cell = document.createElement('div');
          cell.className = 'cal-day other-month';
          cell.textContent = d;
          grid.appendChild(cell);
        }
      }

      function scrollToDate(dateKey) {
        const tl = $('timeline');
        const groups = tl.querySelectorAll('.date-group');
        for (var i = 0; i < groups.length; i++) {
          var g = groups[i];
          var label = g.querySelector('.date-label');
          if (!label) continue;
          var text = label.textContent || '';
          // dateKey like "2026-06-21", substring(5) = "06-21"
          if (text.indexOf(dateKey.substring(5)) !== -1) {
            g.scrollIntoView({ behavior: 'smooth', block: 'start' });
            g.style.transition = 'background 0.3s';
            g.style.background = 'rgba(96,165,250,0.08)';
            g.style.borderRadius = '12px';
            g.style.padding = '12px';
            setTimeout(function() { g.style.background = 'transparent'; }, 1200);
            break;
          }
        }
      }

      function countValid(items) {
        var c = 0;
        items.forEach(function(item) { if (!item.error) c++; });
        return c;
      }
      function updateStats(count, days) {
        var errorCount = allData.filter(function(item) { return item.error; }).length;
        var validCount = count - errorCount;
        $('totalCount').textContent = validCount;
        $('totalDays').textContent = days;
        if (errorCount > 0) {
          $('totalCount').textContent = validCount + ' (+' + errorCount + ' 失败)';
        }

        // 计算总时长
        var totalMinutes = 0;
        allData.forEach(function(item) {
          if (item.error || !item.duration) return;
          var m = item.duration.match(/(\d+)\s*小时?/);
          if (m) totalMinutes += parseInt(m[1]) * 60;
          m = item.duration.match(/(\d+)\s*分/);
          if (m) totalMinutes += parseInt(m[1]);
        });
        if (totalMinutes >= 60) {
          $('totalDuration').textContent = Math.floor(totalMinutes/60) + 'h' + (totalMinutes%60 > 0 ? totalMinutes%60 + 'm' : '');
        } else {
          $('totalDuration').textContent = totalMinutes + 'm';
        }
        if (totalMinutes === 0) $('totalDuration').textContent = '0h';
      }

      $('calPrev').addEventListener('click', function() {
        calMonth--;
        if (calMonth < 0) { calMonth = 11; calYear--; }
        buildCalendar();
      });
      $('calNext').addEventListener('click', function() {
        calMonth++;
        if (calMonth > 11) { calMonth = 0; calYear++; }
        buildCalendar();
      });
      $('calToday').addEventListener('click', function() {
        var now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth();
        buildCalendar();
      });
      $('searchInput').addEventListener('input', function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() { render(); }, 220);
      });

      loadData();
    })();
  </script>
</body>
</html>

<div class="container">

<h1>拍得越多越像，审美趋同怎么破？</h1>
<div class="meta">
  <span class="tag tag-blue">播客</span>
  <span class="tag tag-purple">摄影</span>
  <span class="tag tag-orange">审美</span>
  <span class="tag tag-green">2025首届中文摄影播客节</span>
  <span class="tag tag-gray">接触印相 · 现场对谈</span>
</div>
<div class="summary-line">2024-2025年，小红书上的「新地形摄影」从小众流派变成千篇一律的打卡模板——废墟+冷色调+横平竖直构图，人人复刻。本场摄影播客节对谈（吴晓隆×Tim×刘小川×陈启辉）追问：为什么拍得越多反而越像？结论指向三层机制：①复制是互联网的天性，模仿是学习的第一步（无可厚非）；②算法把「情感共鸣」无限放大，把创作变成迎合；③我们被同一套文化基因喂养大，表达天然趋同。破法不是追求「高级」，而是回到「你真正关心什么」。</div>

<div class="timeline">
  <h3>关键时间轴</h3>
  <div class="timeline-item">
    <span class="timeline-time">00:19</span>
    <span class="timeline-text">话题引入：从「糖水片」之争到小红书的「新地形摄影」现象</span>
  </div>
  <div class="timeline-item">
    <span class="timeline-time">10:04</span>
    <span class="timeline-text">Tim：创作是个人思想的外化；互联网在做「精神的复制」，抹平人的气质</span>
  </div>
  <div class="timeline-item">
    <span class="timeline-time">16:37</span>
    <span class="timeline-text">刘小川：复制→复刻→内化，是分阶段的学习路径；新地形在小红书只是小圈子的信息茧房</span>
  </div>
  <div class="timeline-item">
    <span class="timeline-time">25:04</span>
    <span class="timeline-text">城市趋同论：麦当劳化的城市与「社会的麦当劳化」</span>
  </div>
  <div class="timeline-item">
    <span class="timeline-time">43:12</span>
    <span class="timeline-text">核心分界线：「What's your concern?」——关心什么决定你拍什么</span>
  </div>
  <div class="timeline-item">
    <span class="timeline-time">46:31</span>
    <span class="timeline-text">审美不是「提升」而是「分清」：把艺术当作艺术的能力</span>
  </div>
  <div class="timeline-item">
    <span class="timeline-time">55:05</span>
    <span class="timeline-text">学会「审丑」：从平凡中发现美；AI是终极刻板印象（没有风格）</span>
  </div>
</div>

<div class="map">
  <h2>核心脉络</h2>
  <div class="diagram">
    <div class="node">模仿<br/>（学习第一步）</div>
    <div class="arrow">→</div>
    <div class="node">算法放大<br/>（情感共鸣被流量绑架）</div>
    <div class="arrow">→</div>
    <div class="node">复制成瘾<br/>（糖水片/打卡点）</div>
    <div class="arrow">→</div>
    <div class="node-orange">审美趋同<br/>（千人一面）</div>
  </div>
</div>

<div class="correction">
  <h3>⚠ 常见误解 / 认知纠偏</h3>
  <p>①「审美趋同」≠ 个人没品味——根源是算法、平台、文化基因共同作用；②「模仿风格」≠ 低级——模仿是每个人进入创作的必经阶段，直接批判「新人复刻新地形」是苛刻的；③「审美需要提升」这个说法本身可疑——审美是「把艺术当作艺术的能力」，关键在分清而不是拔高；④「多看大师作品=提升审美」可能是在「向大师的审美靠拢」而非真正拥有判断力。</p>
</div>

<div class="section">
  <h2 class="sec-title">趋同的三大机制</h2>

  <div class="card">
    <h3>机制一：复制是互联网的天性，模仿是学习的起点</h3>
    <p><b>核心机制：</b>抖音刷到挖沙子视频火了→成千上万模仿者；新地形火了→满屏废墟+低饱和。Tim 指出：模仿是学习摄影的方式，复制是互联网的特性，两者叠加，任何「火」的形式都会快速被批量复制。</p>
    <p><b>关键理解：</b>刘小川补充了分阶段论：追逐→形式复制→（有人）追问作者意图→演化出自己的表达。小红书上的新地形群体多停在「形式复制」阶段，这是正常的学习路径，不该被苛责。</p>
    <div class="highlight">原文：「我不能因为有效果了，大家开始在技术复刻和追逐的阶段，又去批判他。」（刘小川）</div>
  </div>

  <div class="card card-purple">
    <h3>机制二：算法把「情感共鸣」无限放大，创作被流量绑架</h3>
    <p><b>核心机制：</b>垂类平台（论坛/博客）上，作品在小圈子里被同行审视；社交平台（小红书）上，算法把照片推给大众，情感共鸣需求被无限放大——数据反应反过来干扰拍摄者：「我拍这个获得好反应，是不是该继续拍这个？」</p>
    <p><b>关键理解：</b>这是对创作者自觉性的考验：是「被流量带着跑」还是「利用流量做自己的事」。互联网利用人性弱点（惰性、欲望、虚荣），创作者和互联网是一种博弈关系。</p>
    <div class="quote">「审美，是你享受拍照的过程；想要一千个赞，是欲望。把这两件事混在一起，你的生活里永远求而不得。」（Tim）</div>
  </div>

  <div class="card card-orange">
    <h3>机制三：同一套文化基因 + 城市标准化 = 表达天然趋同</h3>
    <p><b>核心机制：</b>①我们从小看同样的动画片、电视剧、电影，接受相似教育，文化基因高度相似，点子自然「撞车」；②商业资本对城市做标准化复制（一样的商场、一样的品牌、一样的纪念品），「社会的麦当劳化」（乔治·里茨尔）让独特景观越来越少，摄影题材也只能去边缘捡漏。</p>
    <p><b>关键理解：</b>卡洛·卡尔维诺在《新千年文学备忘录》中的回应：媒体把所有事物变得趋同，越是这样越需要用文字/影像的精确性去保留差异。趋同是系统性的，对抗它需要刻意为之。</p>
  </div>
</div>

<div class="section">
  <h2 class="sec-title">破法：回到「你真正关心什么」</h2>

  <div class="card card-green">
    <h3>核心分界线：What's your concern?</h3>
    <p><b>核心机制：</b>西方艺术学院的教授面对「我该拍什么」的标准答案请求，会反问：你关心的东西是什么？你的生活是什么样？你在想什么问题？——这一问把创作者从「向外找模板」转向「向内找入口」。</p>
    <p><b>关键理解：</b>一旦进入个人入口，你就「不想拍新地形了，反倒想拍拍自己家里的事」。关心度决定投入度，投入度决定作品的生命力。</p>
    <div class="action">落地建议：问自己「你关心这群人/这个场景吗？」——公利路径（拍完会火/会被看见）和私利路径（真的感同身受）拍出来是截然不同的东西。</div>
  </div>

  <div class="card">
    <h3>语言独立性：别让流行风格「套」住你的主题</h3>
    <p><b>核心机制：</b>像刘震云坚持「没有新结构就不按老套路写」——摄影也应先想「用什么创作语言表达这件事是适合我的」，而不是「某风格火→套到我的主题上」。套用必然出现「拧巴」。</p>
    <p><b>关键理解：</b>网络流行语/流行视觉把语言和影像「趋同化、抹平精确性」。拍照时若没有真正感受周遭的人事物，只追随别人拍什么，审美趋同就无法避免。</p>
    <div class="quote">「越是在趋同的情况下，我们越需要文字从语言去加强差异，才能呈现出日常生活的意趣。」</div>
  </div>

  <div class="card card-green">
    <h3>越学越不会拍？那是必经的「无知谷底」</h3>
    <p><b>核心机制：</b>学习曲线：小白→「鱼者高峰」自认牛逼→谷底「发现自己什么都不知道」→很多人在谷底停下。真正的痛苦是「不断认识自己的无知」，但只有穿过痛苦才能学到新东西。</p>
    <p><b>关键理解：</b>解法是「基于很强的实践」——比如一周拍十张，不想拍时也按一张空片。眼高手低是自我认知与真实位置的巨大落差。</p>
    <div class="pitfall">避坑：别停在谷底放弃。自己作为第一个观众，对自己照片满意，别人才可能正向反馈；永远抱着「让别人认可我」的目的做事，最后会很扭曲。</div>
  </div>

  <div class="card card-purple">
    <h3>审美不是「提升」，而是「分清」+ 学会「审丑」</h3>
    <p><b>核心机制：</b>①审美 = 把艺术当作艺术的能力。艺术和哲学是不承担功利/解决问题功能的专业——能说出喜欢/不喜欢杉本博司的理由，审美就在往上走；②「审丑」不是贬义，而是从平凡事物中发现美的能力（如欧文·佩恩拍日常物体）。</p>
    <p><b>关键理解：</b>要警惕「大师获奖=照片好」的权力逻辑——评判背后有权力的影响。提升审美不是向某个标准靠拢，而是对自己的判断绝对诚实。</p>
    <div class="quote">「审美某种程度上就是对自己和他人那种坦诚，一种绝对的诚实。」</div>
  </div>

  <div class="card">
    <h3>AI：终极的刻板印象</h3>
    <p><b>核心机制：</b>AI 能帮你把「话」说清楚、把图生成，但它没有风格——因为它把一切风格混合成终极底色。刘擎称 AI 是「语言的杂种」。</p>
    <p><b>关键理解：</b>「审美趋同的终点就是人的 AI 化」。AI 可以作为「嘴替/脚手架」，但人味（风格、精确性、个人视角）恰恰是 AI 生成内容里缺席的东西——这反而提醒我们什么值得坚持。</p>
  </div>
</div>

<div class="card">
  <h3>观点对比：四位主播对「审美趋同怎么破」的不同侧重</h3>
  <table>
    <tr><th>主播</th><th>核心主张</th><th>对应解法</th></tr>
    <tr><td>Tim</td><td>互联网在做「精神的复制」，抹平人的气质；审美=把艺术当艺术的能力</td><td>分清「审美」与「欲望」，保持个人创作人格的独立</td></tr>
    <tr><td>刘小川</td><td>复制→复刻→内化是正常学习路径；关心度决定作品生命力</td><td>先问「你关心这个项目吗」，公利vs私利两条路</td></tr>
    <tr><td>陈启辉</td><td>趋同源于城市标准化+文化基因相似；AI是终极刻板印象</td><td>用精确性对抗抹平，谨慎使用自己的语言与眼睛</td></tr>
    <tr><td>吴晓隆</td><td>算法把情感共鸣放大、干扰创作者自觉；创作语言要独立</td><td>不被流量带着跑，先想「用什么语言表达我的事」</td></tr>
  </table>
</div>

<div class="conclusion">
  <h2>总结与行动</h2>
  <h3>核心要点</h3>
  <ul>
    <li>审美趋同 = 互联网复制天性 × 算法放大共鸣 × 同一套文化基因 × 城市标准化，四者叠加</li>
    <li>模仿复刻是正常学习阶段，不必自我怀疑；但要清楚自己停在哪个阶段</li>
    <li>创作的分界线是「What's your concern?」——关心什么决定你拍什么</li>
    <li>审美不是提升而是分清：能说出喜欢与不喜欢的理由，就是审美在走</li>
    <li>AI 是终极刻板印象（无风格），人味恰恰是我们要捍卫的东西</li>
  </ul>
  <h3>行动清单</h3>
  <ol>
    <li>做一次「创作人格分裂」实验：一个账号发「拍给大众看」的图，另一份作品只为自己创作、沉淀五年再发布——你会看清自己</li>
    <li>面对新题材先问：我真的关心这群人吗？还是它「会火」？选一条路，并知道两者结果不同</li>
    <li>每周固定产出（如十张，拍不出就按空片），用实践穿过「无知谷底」，别停在谷底</li>
    <li>少刷 Pinterest/小红书「找审美」，多去现场看展览、摸纸张、感受影调，并练习「审丑」——从平凡里找美</li>
    <li>下次想套用流行风格前，先写一句话：这个主题用这个形式，适合我吗？</li>
  </ol>
  <h3>关键认知转变</h3>
  <p>以前认为：拍得越像=我不够努力、审美不够高，要多看大师作品「提升审美」。现在理解了：趋同是系统性的（算法+文化基因+城市标准化），模仿是新人的必经之路；真正的破法是回到个人入口——你关心的、你生活的、你想说的，用独立的创作语言表达，而不是追着「高级感」跑。</p>

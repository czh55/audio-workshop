<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>转录原文 · 播客知识墙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b1120;
      --surface: rgba(255,255,255,0.04);
      --surface2: rgba(255,255,255,0.02);
      --border: rgba(255,255,255,0.08);
      --text: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #60a5fa;
      --accent2: #a78bfa;
      --accent3: #f472b6;
    }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.8;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 17, 32, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
    }
    .toolbar-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px 16px;
      flex-wrap: wrap;
    }
    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
    }
    .back-link:hover { color: var(--accent); }
    .toolbar-title {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .summary-link {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
      padding: 5px 12px;
      border: 1px solid rgba(96,165,250,0.4);
      border-radius: 99px;
      background: rgba(96,165,250,0.08);
      transition: all 0.2s;
    }
    .summary-link:hover {
      color: #fff;
      border-color: var(--accent);
      background: rgba(96,165,250,0.18);
    }

    .header {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 24px 20px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .meta .author { color: var(--accent2); }
    .meta .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 10px;
      border-radius: 10px;
    }

    .search-box {
      max-width: 860px;
      margin: 0 auto 8px;
      padding: 0 24px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-hint { max-width: 860px; margin: 0 auto; padding: 0 24px; color: var(--text-muted); font-size: 12px; margin-bottom: 8px; }

    .content {
      max-width: 860px;
      margin: 0 auto;
      padding: 8px 24px 60px;
    }
    .text {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      font-size: 15px;
      line-height: 2;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .text mark {
      background: rgba(96,165,250,0.3);
      color: var(--accent);
      border-radius: 3px;
      padding: 0 2px;
    }
    .stats {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px 40px;
      display: flex;
      gap: 24px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .error-box {
      max-width: 560px;
      margin: 80px auto;
      padding: 32px;
      text-align: center;
      color: var(--text-secondary);
    }
    .error-box a { color: var(--accent); }

    @media (max-width: 640px) {
      .toolbar { padding: 10px 12px; }
      .toolbar-title { font-size: 13px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .header h1 { font-size: 18px; }
      .text { padding: 16px 14px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-inner">
      <a class="back-link" href="transcripts.html">← 转录搜索</a>
      <div class="toolbar-title" id="docTitle">加载中…</div>
      <a class="summary-link" id="summaryLink" style="display:none;" target="_blank" rel="noopener">📖 查看总结文档 ↗</a>
    </div>
  </div>

  <div class="header" id="header" style="display:none;">
    <h1 id="headerTitle"></h1>
    <div class="meta" id="headerMeta"></div>
  </div>

  <div class="search-box" id="searchBox" style="display:none;">
    <input id="textSearch" type="text" placeholder="在本篇转录中搜索关键词…">
  </div>
  <p class="search-hint" id="searchHint" style="display:none;"></p>

  <div class="content">
    <div class="text" id="textBody"></div>
  </div>

  <div class="stats" id="statsBar"></div>
  <div class="error-box" id="errorBox" style="display:none;"></div>

  <script>
  (function() {
    var params = new URLSearchParams(location.search);
    var file = params.get('f') || '';
    var slug = params.get('slug') || '';

    function escapeHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function escapeRegExp(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function showError(msg) {
      document.getElementById('errorBox').innerHTML = msg;
      document.getElementById('errorBox').style.display = '';
    }

    function getItemBySlug(items, slug) {
      if (!slug) return null;
      for (var i = 0; i < items.length; i++) {
        if (items[i].slug === slug) return items[i];
      }
      return null;
    }

    // 1. 加载索引拿元数据
    fetch('transcripts-index.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var item = getItemBySlug(data.items, slug);
        if (!item && file) {
          // 用文件名推断 slug
          var base = file.split('/').pop().replace(/\.txt$/i, '');
          item = getItemBySlug(data.items, base);
          if (item) slug = base;
        }
        if (!item) {
          document.getElementById('docTitle').textContent = file.replace(/^transcripts\//, '').replace(/\.txt$/i, '');
        }
        init(item);
      })
      .catch(function() {
        init(null);
      });

    function init(item) {
      var filePath = file || (item ? item.file : '');
      if (!filePath || filePath.indexOf('..') !== -1 || !/\.txt$/i.test(filePath)) {
        showError('缺少有效的转录文件参数，请从<a href="transcripts.html">转录搜索</a>进入。');
        return;
      }
      if (!item && slug) {
        filePath = 'transcripts/' + slug + '.txt';
      }

      fetch(filePath)
        .then(function(r) {
          if (!r.ok) throw new Error('无法加载转录文件');
          return r.text();
        })
        .then(function(text) {
          if (!text || text.trim().length < 50) throw new Error('转录内容为空');
          render(item, text);
        })
        .catch(function(err) {
          showError('加载失败：' + escapeHtml(err.message) + '。<a href="transcripts.html">返回转录搜索</a>');
        });
    }

    function render(item, text) {
      document.getElementById('docTitle').textContent = item ? item.title : '转录原文';
      document.title = (item ? item.title : '转录原文') + ' · 转录全文';

      var header = document.getElementById('header');
      if (item) {
        document.getElementById('headerTitle').textContent = item.title;
        var meta = [];
        if (item.date) meta.push('<span class="chip">' + escapeHtml(item.date) + '</span>');
        if (item.author) meta.push('<span class="chip author">' + escapeHtml(item.author) + '</span>');
        if (item.duration) meta.push('<span class="chip">时长 ' + escapeHtml(item.duration) + '</span>');
        if (item.words) meta.push('<span class="chip">' + (item.words >= 10000 ? (item.words / 10000).toFixed(1) + ' 万字' : item.words + ' 字') + '</span>');
        if (item.tags && item.tags.length) {
          item.tags.forEach(function(t) { meta.push('<span class="chip">#' + escapeHtml(t) + '</span>'); });
        }
        document.getElementById('headerMeta').innerHTML = meta.join('');
        header.style.display = '';
      }

      // 总结文档入口
      if (item && item.slug) {
        var link = document.getElementById('summaryLink');
        link.href = './' + item.slug + '-总结.html';
        link.style.display = '';
      }

      // 搜索框（站内高亮）
      var searchBox = document.getElementById('searchBox');
      var hint = document.getElementById('searchHint');
      if (text.length > 2000) {
        searchBox.style.display = '';
        hint.style.display = '';
        hint.textContent = '全文 ' + text.length + ' 字 · 在下方输入关键词可高亮定位';
        var input = document.getElementById('textSearch');
        input.addEventListener('input', function() {
          var q = input.value.trim();
          var body = document.getElementById('textBody');
          if (!q) {
            body.innerHTML = '';
            body.appendChild(document.createTextNode(text));
            return;
          }
          var re = new RegExp('(' + escapeRegExp(q) + ')', 'gi');
          body.innerHTML = escapeHtml(text).replace(re, '<mark>$1</mark>');
        });
      }

      // 正文
      document.getElementById('textBody').textContent = text;

      // 底部统计
      var paragraphs = text.split(/\n\s*\n/).filter(function(p) { return p.trim(); }).length;
      document.getElementById('statsBar').innerHTML =
        '<span>共 ' + text.length + ' 字</span>' +
        '<span>' + paragraphs + ' 个段落</span>' +
        '<span>AI 语音转写 · 原样呈现</span>';
    }
  })();
  </script>
</body>
</html>

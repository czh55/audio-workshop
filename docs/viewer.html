<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG 总结 · 语音讲解</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b1120;
      --surface: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.1);
      --text: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent: #60a5fa;
      --accent2: #a78bfa;
    }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 17, 32, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
    }
    .toolbar-inner {
      max-width: 1400px;
      margin: 0 auto;
    }
    .toolbar-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
      margin-bottom: 12px;
    }
    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover { color: var(--accent); }
    .en-link {
      font-size: 13px;
      color: #5eead4;
      text-decoration: none;
      white-space: nowrap;
      font-weight: 600;
      padding: 5px 12px;
      border: 1px solid rgba(94,234,212,0.45);
      border-radius: 99px;
      background: rgba(94,234,212,0.08);
      transition: all 0.2s;
    }
    .en-link:hover {
      color: #fff;
      border-color: #5eead4;
      background: rgba(94,234,212,0.18);
    }
    .doc-title {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .audio-section {
      background: linear-gradient(135deg, rgba(163,113,247,0.1), rgba(96,165,250,0.08));
      border: 1px solid rgba(163,113,247,0.25);
      border-radius: 14px;
      overflow: hidden;
    }
    .audio-summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .audio-summary::-webkit-details-marker { display: none; }
    .audio-summary:hover { background: rgba(163,113,247,0.08); }
    .audio-summary-chevron {
      margin-left: auto;
      transition: transform 0.2s ease;
      color: var(--text-secondary);
      font-size: 12px;
    }
    .audio-details[open] .audio-summary-chevron { transform: rotate(180deg); }
    .audio-details[open] .audio-summary { border-bottom: 1px solid rgba(163,113,247,0.2); }
    .audio-section-body { padding: 16px 18px 18px; }
    .audio-hint {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .audio-player {
      width: 100%;
      height: 44px;
      border-radius: 10px;
    }
    .playback-speed {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .speed-label {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .speed-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
    }
    .speed-btn:hover, .speed-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(96,165,250,0.12);
    }
    .audio-missing {
      font-size: 13px;
      color: #fbbf24;
      padding: 12px 0 0;
    }
    .svg-wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
    }
    .svg-wrap svg {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1320px;
      max-height: none;
      margin: 0 auto;
      border: none;
      border-radius: 12px;
      background: #f8fafc;
      overflow: visible;
    }
    @media (max-width: 640px) {
      .toolbar { padding: 10px 12px; }
      .toolbar-top { gap: 8px 12px; margin-bottom: 10px; }
      .doc-title { font-size: 14px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .audio-section { border-radius: 12px; }
      .audio-summary { padding: 11px 14px; font-size: 12px; }
      .audio-section-body { padding: 12px 14px 14px; }
      .audio-hint { font-size: 12px; margin-bottom: 10px; }
      .svg-wrap { padding: 8px; }
    }
    .error-box {
      max-width: 560px;
      margin: 80px auto;
      padding: 32px;
      text-align: center;
      color: var(--text-secondary);
    }
    .error-box a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="toolbar" id="toolbar" style="display:none;">
    <div class="toolbar-inner">
      <div class="toolbar-top">
        <a class="back-link" href="index.html">← 返回首页</a>
        <div class="doc-title" id="docTitle">加载中…</div>
        <a class="en-link" id="enLink" style="display:none;" target="_blank" rel="noopener">🌐 EN 双语版 ↗</a>
      </div>
      <div class="audio-section" id="audioSection">
        <details class="audio-details">
          <summary class="audio-summary">
            <span>🎧</span>
            <span>语音讲解</span>
            <span class="audio-summary-status" id="audioSummaryStatus"></span>
            <span class="audio-summary-chevron">▾</span>
          </summary>
          <div class="audio-section-body">
            <p class="audio-hint">通勤时可听，跟着讲解走一遍（edge-tts 自然语音，与 daily-algo 同款）</p>
            <div id="audioMount"></div>
          </div>
        </details>
      </div>
    </div>
  </div>

  <div class="svg-wrap" id="svgWrap"></div>
  <div class="error-box" id="errorBox" style="display:none;"></div>

  <script>
  (function() {
    var params = new URLSearchParams(location.search);
    var file = params.get('f') || params.get('file');
    if (!file || file.indexOf('..') !== -1 || !/\.svg$/i.test(file)) {
      showError('缺少有效的 SVG 文件参数，请从<a href="index.html">首页</a>进入。');
      return;
    }

    function normalizedAudioUrl(svgFile) {
      var mp3 = svgFile.replace(/-(?:播客)?总结(?=\.svg$)/i, '').replace(/\.svg$/i, '.mp3');
      return 'audio/' + mp3;
    }

    function setSpeed(rate) {
      var audio = document.getElementById('summary-audio');
      if (!audio) return;
      audio.playbackRate = rate;
      document.querySelectorAll('.speed-btn').forEach(function(btn) {
        btn.classList.toggle('active', parseFloat(btn.getAttribute('data-rate')) === rate);
      });
    }
    window.setSpeed = setSpeed;

    function mountAudioPlayer(src) {
      document.getElementById('audioMount').innerHTML =
        '<audio controls preload="metadata" class="audio-player" id="summary-audio">' +
          '<source src="' + escapeAttr(src) + '" type="audio/mpeg">' +
          '您的浏览器不支持音频播放' +
        '</audio>' +
        '<div class="playback-speed">' +
          '<span class="speed-label">速度</span>' +
          '<button type="button" class="speed-btn" data-rate="0.75" onclick="setSpeed(0.75)">0.75x</button>' +
          '<button type="button" class="speed-btn active" data-rate="1" onclick="setSpeed(1)">1x</button>' +
          '<button type="button" class="speed-btn" data-rate="1.25" onclick="setSpeed(1.25)">1.25x</button>' +
          '<button type="button" class="speed-btn" data-rate="1.5" onclick="setSpeed(1.5)">1.5x</button>' +
        '</div>';
      var status = document.getElementById('audioSummaryStatus');
      if (status) status.textContent = '· 已就绪';
    }

    function showMissingAudio() {
      document.getElementById('audioMount').innerHTML =
        '<p class="audio-missing">语音文件尚未生成。运行：<code>python3 scripts/generate_svg_audio.py ' +
        escapeHtml(file) + '</code></p>';
      var status = document.getElementById('audioSummaryStatus');
      if (status) status.textContent = '· 未生成';
    }

    function showError(msg) {
      document.getElementById('errorBox').innerHTML = msg;
      document.getElementById('errorBox').style.display = '';
    }

    function escapeHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function escapeAttr(s) {
      return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    }

    var MOBILE_CSS = '@media (max-width:640px){body,.container{padding:16px 12px!important}.container{max-width:100%!important}h1{font-size:24px!important}h2,.sec-title{font-size:18px!important}h3{font-size:16px!important}p,li{font-size:14px!important}.summary-line{font-size:15px!important;padding:14px 16px!important}.map,.card,.timeline{padding:16px!important;margin-bottom:16px!important}.map h2{font-size:18px!important}.diagram{gap:10px!important;padding:10px 0!important}.node{min-width:100px!important;padding:12px 16px!important;font-size:13px!important}.arrow{font-size:18px!important}.conclusion{padding:20px!important}.footer{padding:20px 0 12px!important}}';

    function getSvgCanvasWidth(svgEl) {
      var vb = svgEl.getAttribute('viewBox');
      if (vb) {
        var parts = vb.trim().split(/\s+/);
        if (parts.length === 4) return Number(parts[2]) || 1320;
      }
      return Number(svgEl.getAttribute('width')) || 1320;
    }

    function injectMobileCss(inner) {
      if (inner.querySelector('[data-viewer-mobile]')) return;
      var style = document.createElement('style');
      style.setAttribute('data-viewer-mobile', '1');
      style.textContent = MOBILE_CSS;
      inner.insertBefore(style, inner.firstChild);
    }

    function makeSvgResponsive(svgEl) {
      svgEl.removeAttribute('width');
      svgEl.removeAttribute('height');
      svgEl.setAttribute('preserveAspectRatio', 'xMidYMin meet');
      svgEl.style.width = '100%';
      svgEl.style.height = 'auto';
      svgEl.style.maxHeight = 'none';
    }

    function measureContentHeight(inner) {
      var container = inner.querySelector('.container') || inner;
      var scrollH = Math.ceil(container.scrollHeight || inner.scrollHeight || 0);
      var last = container.lastElementChild;
      if (!last) return scrollH;
      var innerTop = inner.getBoundingClientRect().top;
      var lastBottom = last.getBoundingClientRect().bottom;
      var rectH = Math.ceil(lastBottom - innerTop);
      return Math.max(scrollH, rectH);
    }

    function autoResizeSvg(svgEl) {
      var fo = svgEl.querySelector('foreignObject');
      if (!fo) return;
      var inner = fo.querySelector('div');
      if (!inner) return;
      var width = getSvgCanvasWidth(svgEl);
      var contentH = measureContentHeight(inner);
      if (!contentH || contentH < 200) return;
      var newH = contentH + 80;
      var vb = svgEl.getAttribute('viewBox');
      var declared = vb ? Number(vb.trim().split(/\s+/)[3]) : Number(svgEl.getAttribute('height')) || 0;
      if (newH <= declared + 2) return;
      svgEl.setAttribute('viewBox', '0 0 ' + width + ' ' + newH);
      fo.setAttribute('height', String(newH));
    }

    function setupSvgResizeObserver(svgEl) {
      var fo = svgEl.querySelector('foreignObject');
      var inner = fo && fo.querySelector('div');
      if (!inner || typeof ResizeObserver === 'undefined') return;
      var observer = new ResizeObserver(function() { autoResizeSvg(svgEl); });
      observer.observe(inner);
    }

    var audioSrc = normalizedAudioUrl(file);

    // 推导英文版文件名（如 supermarket-choice-en.html），存在才显示 EN 入口
    var enSlug = file.replace(/-(?:播客)?总结(?=\.svg$)/i, '').replace(/\.svg$/i, '');
    var enHtml = enSlug + '-en.html';
    fetch(enHtml, { method: 'HEAD' })
      .then(function(res) {
        if (res && res.ok) {
          var link = document.getElementById('enLink');
          link.href = enHtml;
          link.style.display = '';
        }
      })
      .catch(function() { /* 无英文版，不显示入口 */ });

    fetch(file)
      .then(function(res) {
        if (!res.ok) throw new Error('无法加载 ' + file);
        return res.text();
      })
      .then(function(svgText) {
        var parser = new DOMParser();
        var doc = parser.parseFromString(svgText, 'image/svg+xml');
        var h1 = doc.querySelector('h1');
        var title = h1 ? h1.textContent.trim() : file.replace(/\.svg$/i, '');
        document.getElementById('docTitle').textContent = title;
        document.title = title + ' · 语音讲解';

        var wrap = document.getElementById('svgWrap');
        wrap.innerHTML = svgText;
        var svgEl = wrap.querySelector('svg');
        if (svgEl) {
          var fo = svgEl.querySelector('foreignObject');
          var inner = fo && fo.querySelector('div');
          if (inner) injectMobileCss(inner);
          makeSvgResponsive(svgEl);
          autoResizeSvg(svgEl);
          setupSvgResizeObserver(svgEl);
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function() { autoResizeSvg(svgEl); });
          }
          window.addEventListener('load', function() { autoResizeSvg(svgEl); });
        }
        document.getElementById('toolbar').style.display = '';

        return fetch(audioSrc, { method: 'HEAD' });
      })
      .then(function(res) {
        if (res && res.ok) {
          mountAudioPlayer(audioSrc);
        } else {
          showMissingAudio();
        }
      })
      .catch(function(err) {
        if (document.getElementById('toolbar').style.display !== 'none') {
          showMissingAudio();
        } else {
          showError('加载失败：' + escapeHtml(err.message) + '。<a href="index.html">返回首页</a>');
        }
      });
  })();
  </script>
</body>
</html>

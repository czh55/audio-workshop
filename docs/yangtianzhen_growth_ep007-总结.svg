      <div class="container">

<h1>Ep.007｜成长，是不断松动「我以为的自己」 Ft.杨天真</h1>
<div class="meta">
  <span class="tag tag-blue">播客</span>
  <span class="tag tag-purple">自我成长</span>
  <span class="tag tag-orange">41分</span>
  <span class="tag tag-green">少一波</span>
</div>
<div class="summary-line">少一波对话杨天真：「做自己」远比任性难，核心是搞清楚「自己」是谁；壳（社会人设）可穿可脱，真我只在有限空间展示；对「真」的追求是一切能量来源，成长是不断松动固化自我认知、从危机或愿景出发的五阶段旅程。</div>

<div class="timeline">
  <h3>关键时间轴</h3>
  <div class="timeline-item">
    <span class="timeline-time">00:00</span>
    <span class="timeline-text">开场：自我欺骗与觉醒，对「真」的追求是能量来源</span>
  </div>
  <div class="timeline-item">
    <span class="timeline-time">03:30</span>
    <span class="timeline-text">杨天真谈被喜欢的原因：好好活着、爱自己、分享探索过程</span>
  </div>
  <div class="timeline-item">
    <span class="timeline-time">08:00</span>
    <span class="timeline-text">「做自己」拆解：「做」是知行合一，「自己」更难定义</span>
  </div>
  <div class="timeline-item">
    <span class="timeline-time">12:30</span>
    <span class="timeline-text">Melting Love 案例：用概念包装恐惧，承认渴望需要勇气</span>
  </div>
  <div class="timeline-item">
    <span class="timeline-time">18:00</span>
    <span class="timeline-text">壳与真我：花钥匙隐喻，盔甲可脱卸，真我需被保护</span>
  </div>
  <div class="timeline-item">
    <span class="timeline-time">26:00</span>
    <span class="timeline-text">自我探索五阶段：从想改变到 Truth for its own sake</span>
  </div>
  <div class="timeline-item">
    <span class="timeline-time">33:00</span>
    <span class="timeline-text">滑雪受伤：巨大愿力才能驱动行动，改变动力 90% 危机 + 10% 愿景</span>
  </div>
  <div class="timeline-item">
    <span class="timeline-time">38:00</span>
    <span class="timeline-text">做好人三层次、先保护自己能量、餐厅故事与关系中的共同利益</span>
  </div>
</div>

<div class="map">
  <h2>核心脉络</h2>
  <div class="diagram">
    <div class="node">自我欺骗<br/>人设/壳</div>
    <span class="arrow">→</span>
    <div class="node-orange">觉察渴望<br/>松动认知</div>
    <span class="arrow">→</span>
    <div class="node-green">对「真」的追求<br/>能量源</div>
    <span class="arrow">→</span>
    <div class="node">壳可穿可脱<br/>真我连接</div>
    <span class="arrow">→</span>
    <div class="node-orange">柔和表达<br/>共同利益</div>
  </div>
</div>

<div class="correction">
  <h3>⚠ 常见误解 / 认知纠偏</h3>
  <p>「做自己」≠ 任性（想吃就吃、想干嘛就干嘛）。真正的做自己 = 搞清楚自己是谁 + 为想要的东西去表达和付出。很多人把「不需要爱情」「不在意别人看法」当作洒脱，其实是在用概念包装恐惧。</p>
</div>

<div class="section">
  <h2 class="sec-title">一、什么是「自己」？</h2>

  <div class="card">
    <h3>「做自己」的两层难度</h3>
    <p><b>核心机制：</b>「做自己」由「做」和「自己」组成。「做」意味着知行合一；「自己」则是冥想中的觉察/失觉察意识、现实中想说不敢说的想法，哪一层才是真我？</p>
    <p><b>关键理解：</b>自己是一个动态概念，会经历多次推翻与重建。过去认定的「真实想法」可能只是表述，深层可能有道德审判或恐惧。</p>
    <p><b>典型场景：</b>当你发现「我其实在意别人怎么看我」「我其实想要亲密关系」时，不是失败，而是松动固化的开始。</p>
    <div class="relation">相关概念：与「任性」「人设」「社会形象」的区别——任性是逃避，做自己是觉察后的表达。</div>
    <div class="highlight">原文依据：「搞清楚自己的定义，可能才是做自己的第一步。但是自己是一个动态的东西。」</div>
  </div>

  <div class="card card-purple">
    <h3>
      <span class="speaker speaker-guest">嘉宾观点</span>
      好好活着，就是对社会最大的价值
    </h3>
    <p>杨天真认为，早期以为要分享职场干货才有价值，后来意识到她最大的价值是「好好活着」——从心底爱自己、不畏争议、把探索过程分享出来。对批评不在意，对赞美也不在意。</p>
    <div class="quote">「我只要活着，然后充分地做自己就好了。过程中如果被喜欢，我感激；不被喜欢，我也不难过。」</div>
  </div>
</div>

<div class="section">
  <h2 class="sec-title">二、壳、真我与「花钥匙」</h2>

  <div class="card">
    <h3>壳（社会人设）vs 真我</h3>
    <p><b>核心机制：</b>从小到大建设的「壳」让我们符合父母、老师、社交场合的预期，帮助生存、避免受伤。但壳也会限制感受——少一波曾以「没感情」的壳生活，看不到风景、不理解女儿哭泣。</p>
    <p><b>关键理解：</b>壳永远不会完全消散，也不必消散。目标是：不把壳当成自己，而是像盔甲一样可穿可脱。真我有无限的爱、勇气和慈悲。</p>
    <p><b>典型场景：</b>在嫌恶环境中穿上壳保护自己；在安全空间里脱下壳与真我连接。</p>
    <div class="relation">杨天真用《花仙子》花钥匙类比：不同场合扮演不同角色不是虚伪，真我需要被保护，只在有限空间和有限人面前展示。</div>
    <div class="highlight">原文依据：「我们不应该做橡皮泥，应该做固定的骨骼，但可以有很多花衣裳。」</div>
  </div>

  <div class="card card-orange">
    <h3>⚠ 把壳当全部自己</h3>
    <p><b>原因：</b>壳很脆弱，需要不停维护；残酷打击会击溃壳或让它变硬加厚，与真我失联 20-50 年。</p>
    <div class="pitfall">少一波：「当我把自己当成这个壳的时候，出现残酷问题可能会被击溃，需要很长时间治疗。」</div>
    <p><b>解法：</b>与壳内真我建立连接后，面对世界再多的残忍也能更坦然应对。</p>
    <p><b>严重程度：</b>小心——长期忽视真我会限制生命绽放。</p>
  </div>
</div>

<div class="section">
  <h2 class="sec-title">三、对「真」的追求</h2>

  <div class="card card-purple">
    <h3>
      <span class="speaker speaker-guest">嘉宾观点</span>
      真是一种至高的追求
    </h3>
    <p>真不是主观定义，也不是摄像机客观场景，而是人与人之间「心知肚明就是这么回事」。关系必须面对真相，所有假的东西都不值得投入且会破碎。</p>
    <div class="quote">「我生命中有一个东西牵引着我，它可能是我所有能量的来源，这个东西就叫做你对真的追求。」</div>
    <div class="action">怎么落地：在亲密关系中停止表演成另一个人；说真话可能不得预期，但假装的代价是身心俱疲。</div>
    <p><b>适用边界：</b>真只有当事人和共同经历者才知道；表达真话的方式可以修炼（如杨天真学「船要沉了」如何更负责任地说）。</p>
  </div>

  <div class="card">
    <h3>Melting Love：用概念包装恐惧</h3>
    <p><b>核心机制：</b>杨天真曾恐惧「相容之爱」（自我溶解、无边界），表现出攻击性和「不需要」。深层是害怕得不到、不会处理，却用「爱情浪费生命」等人设包装。</p>
    <p><b>关键理解：</b>承认「我也非常想要这样的 melting love」需要巨大勇气——对自己承认，更对在公众面前承认。</p>
    <div class="highlight">原文依据：「人有的时候是被社会形象塑造的……你要用一种概念去包装自己的恐惧。」</div>
  </div>
</div>

<div class="section">
  <h2 class="sec-title">四、自我探索的五阶段</h2>

  <div class="card">
    <h3>少一波的成长阶梯框架</h3>
    <table>
      <tr><th>阶段</th><th>内容</th><th>关键转折</th><th>一句话</th></tr>
      <tr><td>1</td><td>发现不能接受的东西</td><td>如做爸爸后的羞耻感</td><td>「有东西我想改变」</td></tr>
      <tr><td>2</td><td>相信可以改变</td><td>很多人卡在这里</td><td>「这不是注定的」</td></tr>
      <tr><td>3</td><td>花时间真正探索</td><td>找老师、找方法</td><td>投入时间与勇气</td></tr>
      <tr><td>4</td><td>发现更多可松动处</td><td>菊与刀式「这块能变，别处也能」</td><td>自我认定全面松动</td></tr>
      <tr><td>5</td><td>为真本身而求真</td><td>Truth for its own sake</td><td>不为解决问题，只为连接真我</td></tr>
    </table>
    <div class="relation">杨天真补充：打破固化认知充满风险——安全感消失、自信动摇，有人退回去，有人更往前走。</div>
  </div>

  <div class="card card-orange">
    <h3>⚠ 改变动力不足</h3>
    <p><b>原因：</b>90% 动力来自「无法接受现状」的危机；仅 10% 来自愿景驱动，且难以持续。</p>
    <div class="pitfall">杨天真滑雪受伤：每天背单词、做康复做不到，但为「真的想滑雪」可开始艰难康复之旅。</div>
    <p><b>解法：</b>先从小改变获得甜头和自由感，再驱动更大改变；接受探索路上会出现新焦虑（少一波承认焦虑花了半年）。</p>
    <p><b>严重程度：</b>可忽略——没有危机也不代表不能开始，好奇心也是入口。</p>
  </div>
</div>

<div class="section">
  <h2 class="sec-title">五、做好人、责任与关系</h2>

  <div class="card">
    <h3>帮助他人的三个层次</h3>
    <table>
      <tr><th>层次</th><th>动机</th><th>特征</th><th>评价</th></tr>
      <tr><td>第一层</td><td>好人有好报</td><td>为福报做事</td><td>仍有壳的包装</td></tr>
      <tr><td>第二层</td><td>助人为乐</td><td>求心里愉悦感</td><td>比第一层自然</td></tr>
      <tr><td>第三层</td><td>自然而然</td><td>命运推到面前就做</td><td>杨天真向往的状态</td></tr>
    </table>
    <p>少一波反思：曾通过「做好人/做善事」获得自我肯定，与从前数学第一名、商业成功一样——变汤没变料，仍是壳的自我肯定。</p>
  </div>

  <div class="card card-purple">
    <h3>
      <span class="speaker speaker-guest">嘉宾观点</span>
      先保护自己，再有馀力帮助别人
    </h3>
    <p>飞机氧气面罩原则：紧急时刻先照顾好自己，有馀力再照顾别人。只保护自己就是自私，但先保护自己是守卫能量。</p>
    <div class="quote">「日行的小善——带着善意的善，intention 不一样，整个行为就会不一样。」</div>
  </div>

  <div class="card card-green">
    <h3>餐厅故事：关系中的共同利益</h3>
    <p>朋友远程安排餐厅，杨天真曾因「未经允许安排行程」坚持自己去吃，让大家不开心。如今意识到：接受对方的善意，比吃那顿想吃的饭更重要。好关系的目标是「你也要开心，我也要开心」，而非「只有我开心」。安排餐厅的朋友已过世，成为珍惜善意的提醒。</p>
    <div class="highlight">原文依据：「如果你想要一个好的关系，你必须得以你们共同的利益为一个目标。」</div>
  </div>
</div>

<div class="card">
  <h3>观点对比：表达自我的方式</h3>
  <table>
    <tr><th>维度</th><th>过去的杨天真</th><th>现在的方向</th><th>一句话结论</th></tr>
    <tr><td>动机</td><td>保护自己感受、表达爽快</td><td>保留完整自己，减少伤害</td><td>不是压抑，是选择</td></tr>
    <tr><td>方式</td><td>锐利、shock、坚固</td><td>更柔和、不冒犯</td><td>柔和也可以很真</td></tr>
    <tr><td>关系观</td><td>只有我开心，你们跟着</td><td>共同利益优先</td><td>包容≠我做对了</td></tr>
    <tr><td>真相</td><td>说真话不顾表达方式</td><td>说真话 + 修炼表达</td><td>负责任的真</td></tr>
  </table>
</div>

<div class="card card-purple">
  <h3>💡 心法：成长是松动，不是换壳</h3>
  <p><b>为什么重要：</b>固化认知带来虚假安全感；松动后可能迷茫，但也会获得数量级的新自由。</p>
  <div class="quote">「成长，是不断松动『我以为的自己』。」</div>
  <div class="action">怎么落地：当发现「我以为我不在意」时，停下来问——这是真我不需要，还是用概念包装了恐惧？</div>
  <p><b>适用边界：</b>个人修行没法劝来——只有好奇心或真需求才会让人走上这条路；不是每个人都要到第五阶段。</p>
</div>

<div class="conclusion">
  <h2>总结与行动</h2>
  <h3>核心要点</h3>
  <ul>
    <li>「做自己」≠任性，而是搞清楚动态变化的「自己」并为之表达付出</li>
    <li>壳（社会人设）可穿可脱，真我只在有限空间展示，需被保护</li>
    <li>对「真」的追求是一切能量的来源，关系中的假最终会破碎</li>
    <li>自我探索有五阶段，最终可进入「为真本身而求真」</li>
    <li>改变 90% 靠危机驱动，从小改变获得甜头可启动更大探索</li>
  </ul>
  <h3>行动清单</h3>
  <ol>
    <li>写下一件你「以为不在意」但深层其实在意的事，问自己：这是真我，还是用概念包装了恐惧？</li>
    <li>识别你当前的「壳」：它在保护什么？哪些场合可以脱下它？</li>
    <li>在一段关系中练习「共同利益」思维：下次冲突时问「怎样我们都开心？」而非「怎样我开心」</li>
    <li>每天做一件带着善意的小善，而非追求「做好人」的人设光环</li>
    <li>若对自我探索有好奇心，从一个小问题开始（如「我为什么对某事有羞耻感？」），不必等危机</li>
  </ol>
  <h3>关键认知转变</h3>
  <p>以前认为「做自己就是率性表达、不顾他人」；现在理解了「保留完整的自己，可以选择更柔和的方式，过程中也会更真」。以前认为「壳就是虚伪」；现在理解了「壳是花钥匙，真我需要被保护，关键是与真我保持连接」。</p>
</div>

